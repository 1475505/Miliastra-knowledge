<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1510">
<defs>
  <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#2D6BE4"/>
    <stop offset="100%" stop-color="#4A3F6B"/>
  </linearGradient>
  <filter id="card">
    <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/>
  </filter>
  <filter id="elevated">
    <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/>
  </filter>
</defs>
<style>
  text { font-family: 'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif; }
</style>

<rect width="1200" height="1510" fill="#F9F7F2"/>
<rect width="1200" height="6" fill="url(#topGrad)"/>

<!-- Title Card -->
<rect x="48" y="32" width="1104" height="80" rx="14" fill="#fff" filter="url(#elevated)"/>
<rect x="48" y="32" width="4" height="80" rx="2" fill="#2D6BE4"/>
<text x="72" y="72" fill="#1A1B2E" font-size="34" font-weight="bold">关卡实体</text>
<text x="220" y="70" fill="#4A4B65" font-size="16">承载关卡逻辑的特殊实体 -- 创建、编辑与特性</text>

<!-- ========== Section 一: 定义与创建 ========== -->
<text x="48" y="150" fill="#2D6BE4" font-size="18" font-weight="700">一、关卡实体的定义与创建</text>

<rect x="48" y="168" width="1104" height="160" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="168" width="4" height="160" rx="2" fill="#2D6BE4"/>
<text x="72" y="198" fill="#1A1B2E" font-size="16" font-weight="500">核心定义</text>

<text x="72" y="226" fill="#4A4B65" font-size="14">关卡是一种特殊的实体，被推荐用于承载关卡逻辑。</text>

<text x="72" y="256" fill="#1A1B2E" font-size="14" font-weight="500">创建方式：</text>
<text x="72" y="278" fill="#4A4B65" font-size="14">关卡实体在新建一个关卡后会自动创建在场景当中，并且在场景中用一个特殊图标进行表示。</text>

<rect x="72" y="296" width="1056" height="24" rx="8" fill="#E8EEFB"/>
<text x="84" y="313" fill="#2D6BE4" font-size="12" font-weight="500">无需手动创建，关卡新建时自动生成</text>

<!-- ========== Section 二: 编辑 ========== -->
<text x="48" y="370" fill="#2D6BE4" font-size="18" font-weight="700">二、关卡实体的编辑</text>

<rect x="48" y="388" width="1104" height="260" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="388" width="4" height="260" rx="2" fill="#2D6BE4"/>
<text x="72" y="418" fill="#1A1B2E" font-size="16" font-weight="500">编辑面板（切换到实体编辑页签）</text>

<text x="72" y="446" fill="#4A4B65" font-size="14">关卡实体的编辑和其他类型的实体类似，但实际可配置的基础信息和组件会有所区别。</text>

<!-- 基础信息 -->
<rect x="72" y="468" width="120" height="28" rx="14" fill="#2D6BE4"/>
<text x="132" y="487" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">基础信息</text>
<text x="204" y="487" fill="#4A4B65" font-size="13">可配置关卡实体的所有可用属性</text>

<!-- 通用组件 -->
<rect x="72" y="506" width="120" height="28" rx="14" fill="#2D6BE4"/>
<text x="132" y="525" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">通用组件</text>
<text x="204" y="525" fill="#4A4B65" font-size="13">可给关卡实体添加通用组件配置</text>

<text x="72" y="556" fill="#1A1B2E" font-size="13" font-weight="500">关卡实体可用组件：</text>

<rect x="72" y="570" width="140" height="26" rx="13" fill="#E8EEFB"/>
<text x="142" y="588" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">自定义变量</text>

<rect x="224" y="570" width="140" height="26" rx="13" fill="#E8EEFB"/>
<text x="294" y="588" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">全局计时器</text>

<!-- 节点图 -->
<rect x="72" y="608" width="120" height="28" rx="14" fill="#2D6BE4"/>
<text x="132" y="627" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">节点图</text>
<text x="204" y="627" fill="#4A4B65" font-size="13">可给关卡实体添加节点图或查看已添加的节点图</text>

<!-- ========== Section 三: 特性 ========== -->
<text x="48" y="690" fill="#2D6BE4" font-size="18" font-weight="700">三、关卡实体的特性</text>

<rect x="48" y="708" width="540" height="260" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="708" width="4" height="260" rx="2" fill="#2D6BE4"/>
<text x="72" y="738" fill="#1A1B2E" font-size="16" font-weight="500">区别于其他实体的特殊特性</text>

<rect x="72" y="754" width="160" height="26" rx="13" fill="#FFF3E0"/>
<text x="152" y="772" fill="#E65100" font-size="12" text-anchor="middle" font-weight="500">可接收特殊事件</text>
<text x="244" y="772" fill="#4A4B65" font-size="13">部分特殊事件只有关卡实体可接收</text>

<text x="72" y="800" fill="#4A4B65" font-size="13">物件和造物类型的实体在移除/销毁时，</text>
<text x="72" y="820" fill="#4A4B65" font-size="13">实体本身无法收到对应事件，</text>
<text x="72" y="840" fill="#4A4B65" font-size="13">事件会转发到关卡实体上，由关卡实体处理后续逻辑。</text>

<rect x="72" y="860" width="160" height="26" rx="13" fill="#E8EEFB"/>
<text x="152" y="878" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">无物理实体</text>
<text x="244" y="878" fill="#4A4B65" font-size="13">关卡实体是纯逻辑实体</text>

<rect x="72" y="896" width="160" height="26" rx="13" fill="#E8EEFB"/>
<text x="152" y="914" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">布设信息不全</text>
<text x="244" y="914" fill="#4A4B65" font-size="13">只有位置信息，没有旋转、缩放信息</text>

<rect x="72" y="932" width="160" height="26" rx="13" fill="#E8EEFB"/>
<text x="152" y="950" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">生命周期</text>
<text x="244" y="950" fill="#4A4B65" font-size="13">随关卡初始化创建，随关卡销毁而销毁</text>

<!-- Card: 事件转发机制 -->
<rect x="612" y="708" width="540" height="260" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="708" width="4" height="260" rx="2" fill="#2D6BE4"/>
<text x="636" y="738" fill="#1A1B2E" font-size="16" font-weight="500">事件转发机制详解</text>

<text x="636" y="766" fill="#4A4B65" font-size="14">当物件或造物被移除/销毁时：</text>

<circle cx="648" cy="794" r="12" fill="#2D6BE4"/>
<text x="648" y="799" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">1</text>
<text x="668" y="799" fill="#4A4B65" font-size="13">实体本身无法收到移除/销毁事件</text>

<circle cx="648" cy="824" r="12" fill="#2D6BE4"/>
<text x="648" y="829" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">2</text>
<text x="668" y="829" fill="#4A4B65" font-size="13">事件被转发到关卡实体</text>

<circle cx="648" cy="854" r="12" fill="#2D6BE4"/>
<text x="648" y="859" fill="#fff" font-size="11" text-anchor="middle" font-weight="700">3</text>
<text x="668" y="859" fill="#4A4B65" font-size="13">关卡实体上的节点图可监听并处理</text>

<rect x="636" y="878" width="492" height="44" rx="8" fill="#FFF3E0"/>
<text x="648" y="898" fill="#E65100" font-size="12" font-weight="500">关卡实体可监听的特殊事件：</text>
<text x="648" y="916" fill="#4A4B65" font-size="12">实体销毁时 / 实体移除/销毁时（仅关卡实体可触发）</text>

<rect x="636" y="932" width="492" height="28" rx="8" fill="#E5F2E9"/>
<text x="648" y="951" fill="#2E7D32" font-size="12" font-weight="500">推荐在关卡实体上挂载全局逻辑节点图（如计分机制）</text>

<!-- ========== Section 四: 关卡设置关联 ========== -->
<text x="48" y="1010" fill="#2D6BE4" font-size="18" font-weight="700">四、关卡设置中的关卡实体</text>

<rect x="48" y="1028" width="1104" height="180" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="1028" width="4" height="180" rx="2" fill="#2D6BE4"/>
<text x="72" y="1058" fill="#1A1B2E" font-size="16" font-weight="500">关卡设置中的关卡实体入口</text>

<text x="72" y="1086" fill="#4A4B65" font-size="14">关卡创建时一同创建的物件，无法添加或删除。</text>

<text x="72" y="1116" fill="#4A4B65" font-size="14">是唯一可以监听倒下信息的物件。</text>

<text x="72" y="1146" fill="#4A4B65" font-size="14">点击【查看】可跳转至场景中关卡实体所在位置，可对关卡实体进行编辑。</text>

<rect x="72" y="1168" width="1056" height="28" rx="8" fill="#E8EEFB"/>
<text x="84" y="1187" fill="#2D6BE4" font-size="12" font-weight="500">关卡实体是关卡全局逻辑的核心承载者</text>

<!-- ========== Section 五: 节点图查询 ========== -->
<text x="48" y="1250" fill="#2D6BE4" font-size="18" font-weight="700">五、节点图中的关卡实体操作</text>

<rect x="48" y="1268" width="1104" height="140" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="1268" width="4" height="140" rx="2" fill="#2D6BE4"/>
<text x="72" y="1298" fill="#1A1B2E" font-size="16" font-weight="500">相关节点</text>

<rect x="72" y="1314" width="200" height="26" rx="13" fill="#E5F2E9"/>
<text x="172" y="1332" fill="#2E7D32" font-size="12" text-anchor="middle" font-weight="500">获取关卡实体（查询）</text>
<text x="284" y="1332" fill="#4A4B65" font-size="13">出参：关卡实体（实体类型）</text>

<rect x="72" y="1350" width="200" height="26" rx="13" fill="#FFF3E0"/>
<text x="172" y="1368" fill="#E65100" font-size="12" text-anchor="middle" font-weight="500">结算关卡（执行）</text>
<text x="284" y="1368" fill="#4A4B65" font-size="13">触发关卡结算流程，按关卡结算逻辑进行局外结算</text>

