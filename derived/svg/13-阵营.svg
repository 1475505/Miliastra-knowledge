<text x="84" y="1810" fill="#2D6BE4" font-size="12" font-weight="500">关系解读：</text>
<text x="84" y="1830" fill="#4A4B65" font-size="12">玩家阵营 vs 造物阵营：双向敌对（玩家攻击造物，造物攻击玩家）</text>
<text x="84" y="1850" fill="#4A4B65" font-size="12">玩家阵营 vs 物件阵营3：双向友善（物件阵营3辅助玩家，玩家不攻击物件阵营3）</text>
<text x="84" y="1870" fill="#4A4B65" font-size="12">物件阵营1 vs 物件阵营2：双向敌对（用于需要互相攻击的物件组）</text>

