<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
    <filter id="elevated"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="1600" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  
  <!-- Title -->
  <rect x="40" y="30" width="1120" height="90" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="40" y="30" width="4" height="90" rx="2" fill="#2D6BE4"/>
  <text x="70" y="72" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">装备栏</text>
  <text x="70" y="100" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">装备系统 -- 装备定义、词条、装备类型/标签、装备栏模板与节点图操作</text>
  <!-- Section 1 -->
  <text x="60" y="155" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">一、装备的定义</text>
  <rect x="60" y="170" width="1080" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="198" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">装备是道具的子类型，通过背包管理。不同之处在于可被装备到装备栏位上，提供属性加成或额外逻辑功能。</text>
  <text x="80" y="222" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">基础设置与普通道具基本一致，但不支持配置堆叠。新建道具时选择类型为"装备"。</text>
  <!-- Section 2: 交互设置 -->
  <text x="60" y="285" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">二、装备交互设置</text>
  <rect x="60" y="300" width="1080" height="120" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="328" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">装备类型：在装备类型页签定义，装备栏位需支持该类型才可装备成功</text>
  <text x="80" y="350" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">详情中显示类型：运行时界面是否显示装备类型信息</text>
  <text x="80" y="372" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">详情中显示标签：运行时界面是否显示装备标签信息</text>
  <text x="80" y="394" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">选择标签：在已配置的装备标签内选择该装备携带的标签</text>
  <text x="80" y="414" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">选择初始词条：在已配置的装备词条内选择该装备携带的初始词条</text>
  <!-- Section 3: 装备类型/标签/词条 -->
  <text x="60" y="455" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">三、装备类型、标签与词条</text>
  <rect x="60" y="470" width="340" height="120" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="498" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">装备类型</text>
  <text x="80" y="520" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备模板定义类型 + 装备栏位定义接受类型</text>
  <text x="80" y="540" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">类型列表交集不为空即可装备成功</text>
  <text x="80" y="560" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">编辑：装备数据管理 > 装备类型页签</text>
  <text x="80" y="580" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">类型名称 | 配置ID | 引用列表</text>
  <rect x="430" y="470" width="340" height="120" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="450" y="498" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">装备标签</text>
  <text x="450" y="520" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备的外显备注，向玩家传达装备特性</text>
  <text x="450" y="540" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">编辑：装备数据管理 > 标签页签</text>
  <text x="450" y="560" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">标签名称 | 配置ID | 引用列表</text>
  <rect x="800" y="470" width="340" height="120" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="820" y="498" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">装备词条</text>
  <text x="820" y="520" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">属性加成和机制加成的唯一来源</text>
  <text x="820" y="540" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">一件装备可持有多个词条</text>
  <text x="820" y="560" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">编辑：装备数据管理 > 词条页签</text>
  <text x="820" y="580" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">词条名称 | 配置ID | 引用列表</text>
  <!-- 词条详细 -->
  <rect x="60" y="600" width="1080" height="200" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="628" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">词条属性详细配置</text>
  <text x="80" y="652" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">生效时机：获取时生效（进入背包即对持有者生效）| 装备时生效（装入栏位才对装备者生效）</text>
  <text x="80" y="676" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">词条类型：</text>
  <text x="80" y="698" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">基础属性加成：选择属性（唯一）| 加成类型（随机值/固定值）| 随机值范围或固定值</text>
  <text x="80" y="718" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">描述类型：固定描述（可显示随机值上下限）| 自定义描述（支持插入变量显示加成范围/实际值）</text>
  <text x="80" y="742" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">赋予节点图：选择关联的节点图 | 赋予单位状态：选择关联的单位状态</text>
  <text x="80" y="766" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">词条进入背包或被装备时，加成会应用到持有者/装备者实体上</text>
  <text x="80" y="786" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">装备首次进入背包时初始化，词条数值随机，抛出装备初始化事件</text>
  <!-- Section 4: 装备栏 -->
  <text x="60" y="835" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">四、装备栏</text>
  <rect x="60" y="850" width="520" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="878" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">装备栏模板</text>
  <text x="80" y="902" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">定义装备栏位样式、数量及每个栏位的装备标签</text>
  <text x="80" y="924" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">编辑入口：货币与背包按钮 > 装备栏页签</text>
  <text x="80" y="948" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">模板名称 | 配置ID | 装备栏样式（动态叠加栏位）</text>
  <text x="80" y="968" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">栏位设置：栏位名称 | 可装备类型 | 图标（未放装备时底图）</text>
  <rect x="620" y="850" width="520" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="878" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">装备栏组件</text>
  <text x="640" y="902" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">仅角色可添加。添加通用组件 > 装备栏组件</text>
  <text x="640" y="924" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">装备栏模板：引用预定义的装备栏模板</text>
  <text x="640" y="948" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">装备栏是装备的容器，词条生效依赖装备行为触发</text>
  <rect x="640" y="962" width="140" height="22" rx="11" fill="#FDE8E6"/><text x="654" y="978" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">仅角色可添加</text>
  <!-- Section 5: 节点图 -->
  <text x="60" y="1045" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">五、节点图操作装备</text>
  <rect x="60" y="1060" width="340" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="60" y="1060" width="340" height="28" rx="14" fill="#2D6BE4"/>
  <text x="80" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">执行节点</text>
  <text x="80" y="1108" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">修改装备词条值</text>
  <text x="80" y="1128" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">移除装备词条</text>
  <text x="80" y="1148" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备添加词条</text>
  <text x="80" y="1168" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备指定序号添加词条</text>
  <rect x="430" y="1060" width="340" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="430" y="1060" width="340" height="28" rx="14" fill="#2D6BE4"/>
  <text x="450" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">事件节点</text>
  <text x="450" y="1108" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备初始化时</text>
  <text x="450" y="1128" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备的词条数值改变时</text>
  <text x="450" y="1148" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备被卸下时</text>
  <text x="450" y="1168" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">装备被穿戴时</text>
  <rect x="800" y="1060" width="340" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="800" y="1060" width="340" height="28" rx="14" fill="#2D6BE4"/>
  <text x="820" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">查询节点</text>
  <text x="820" y="1108" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">查询装备标签列表</text>
  <text x="820" y="1128" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">获取装备词条配置ID</text>
  <text x="820" y="1148" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">获取装备词条列表</text>
  <text x="820" y="1168" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">获取装备词条数值</text>
  <!-- 装备实例 -->
  <text x="60" y="1235" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">六、装备实例与初始化</text>
  <rect x="60" y="1250" width="1080" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="1278" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">装备未被拾取时以模板形式存在于掉落物组件内。首次进入背包时初始化，词条数值随机，抛出装备初始化事件。</text>
  <text x="80" y="1300" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">事件出参返回装备实例唯一索引，通过索引可动态修改词条属性。可自定义初始化规则覆写预制随机规则。</text>
