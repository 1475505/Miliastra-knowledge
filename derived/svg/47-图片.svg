<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 780">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="1200" height="780" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  

  <!-- Title -->
  <rect x="40" y="30" width="1120" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="40" y="30" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="64" y="62" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">图片控件</text>
  <text x="64" y="90" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">界面布局中显示图片 | 静态引用与动态引用 | 美化与丰富表现</text>

  <!-- Section 1: Function -->
  <rect x="40" y="130" width="540" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">一、图片的功能</text>
  <text x="60" y="188" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">图片可配置在界面布局中，显示对应图片。</text>
  <text x="60" y="211" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">用于美化、丰富界面表现。</text>
  <text x="60" y="234" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">关卡运行中，可通过节点图唤起图片控件。</text>
  <rect x="60" y="248" width="160" height="24" rx="12" fill="#E8EEFB"/>
  <text x="75" y="265" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">界面控件组编辑窗口添加</text>

  <!-- Section 2: Image Source -->
  <rect x="620" y="130" width="540" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">二、图片源类型</text>
  <rect x="640" y="178" width="80" height="24" rx="12" fill="#E8EEFB"/>
  <text x="655" y="195" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">静态引用</text>
  <text x="730" y="195" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">选择预设素材，支持配置颜色</text>
  <rect x="640" y="208" width="80" height="24" rx="12" fill="#FFF3E0"/>
  <text x="655" y="225" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#E65100">动态引用</text>
  <text x="730" y="225" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">配置自定义变量作为图片标识</text>
  <rect x="640" y="238" width="80" height="24" rx="12" fill="#E5F2E9"/>
  <text x="655" y="255" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2E7D32">道具/状态</text>
  <text x="730" y="255" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">道具、状态、技能、单位状态图标</text>

  <!-- Section 3: Static Reference Details -->
  <rect x="40" y="290" width="1120" height="250" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="320" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">三、静态引用详细配置</text>

  <text x="60" y="350" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">引用素材资产：</text>
  <text x="200" y="350" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">选择预设素材，部分素材支持配置颜色</text>

  <text x="60" y="378" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">填充颜色：</text>
  <text x="200" y="378" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">图片资产分单色和彩色两类，通过选色器修改颜色</text>

  <text x="60" y="406" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">图片类型：</text>
  <text x="200" y="406" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">支持基础、拉伸。部分图片资产具有拉伸属性</text>

  <!-- Image type table -->
  <rect x="60" y="425" width="1080" height="36" rx="8" fill="#E8EEFB"/>
  <text x="80" y="448" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">图片属性</text>
  <text x="260" y="448" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">特性</text>
  <text x="640" y="448" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">常见用途</text>

  <text x="80" y="480" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">普通</text>
  <text x="260" y="480" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">拉伸时四角会跟随形变</text>
  <text x="640" y="480" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">拼接特定形状或基础图案</text>

  <text x="80" y="506" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">三宫格</text>
  <text x="260" y="506" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">横向或纵向拉伸时，四角维持原形状不变</text>
  <text x="640" y="506" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">自定义样式按钮、页签项等控件底板图片</text>

  <text x="80" y="532" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">九宫格</text>
  <text x="260" y="532" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">横纵向拉伸时，四角都保持原有形状不变</text>
  <text x="640" y="532" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">列表项底板、页签、单选项视窗等背景图片</text>

  <!-- Section 4: Dynamic Reference -->
  <rect x="40" y="560" width="540" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="590" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">四、动态引用配置</text>
  <text x="60" y="618" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">当图片源配置为动态引用、道具、状态、技能、单位状态时：</text>
  <text x="60" y="645" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">支持配置自定义变量，作为对应图片的标识使用。</text>
  <text x="60" y="672" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">运行时根据变量值动态切换显示的图片。</text>

  <!-- Section 5: Color -->
  <rect x="620" y="560" width="540" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="590" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">五、颜色与类型说明</text>
  <text x="640" y="618" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">单色资产修改颜色时具有更好的表现。</text>
  <text x="640" y="645" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">彩色资产修改颜色时效果有限。</text>
  <text x="640" y="672" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可通过图片资产库中的筛选项查找具有拉伸属性的资产。</text>

  <!-- Footer -->
  <text x="600" y="750" text-anchor="middle" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">由 AI 基于官方奇匠学院文档生成。版本：月之七</text><!-- 相关文档 -->
