<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1184">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6BE4"/>
      <stop offset="100%" stop-color="#4A3F6B"/>
    </linearGradient>
    <filter id="card">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/>
    </filter>
    <filter id="elevated">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="1184" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>

  <!-- 标题卡片 -->
  <rect x="48" y="32" width="1104" height="80" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="48" y="32" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="72" y="74" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">图片控件</text>
  <text x="224" y="74" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" fill="#4A4B65">界面布局中显示图片 · 美化丰富表现 · 节点图唤起</text>

  <!-- 一、图片的功能 -->
  <rect x="48" y="128" width="540" height="150" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">一、图片的功能</text>
  <text x="72" y="192" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">图片可配置在界面布局中，并显示对应图片</text>
  <text x="72" y="216" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">用于美化、丰富表现而使用的界面控件</text>
  <text x="72" y="240" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">关卡运行中，可通过节点图唤起图片控件</text>
  <rect x="72" y="252" width="172" height="26" rx="13" fill="#E8EEFB"/>
  <text x="158" y="269" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">界面布局 · 图片显示控件</text>

  <!-- 二、添加图片 -->
  <rect x="612" y="128" width="540" height="150" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="636" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">二、添加图片</text>
  <text x="636" y="192" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">在「界面控件组编辑窗口」中操作</text>
  <text x="636" y="216" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">添加「界面控件模板 - 图片」</text>
  <text x="636" y="240" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">即可在界面布局中显示对应图片</text>
  <rect x="636" y="252" width="180" height="26" rx="13" fill="#E8EEFB"/>
  <text x="726" y="269" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">界面控件组 → 图片模板</text>

  <!-- 三、图片源设置 -->
  <rect x="48" y="294" width="1104" height="150" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="326" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">三、图片源设置</text>
  <text x="72" y="356" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">图片源为枚举参数，共 6 种类型，选择结果直接影响后续展示的配置参数</text>
  <rect x="72" y="372" width="100" height="34" rx="17" fill="#E8EEFB"/>
  <text x="122" y="394" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">静态引用</text>
  <rect x="184" y="372" width="100" height="34" rx="17" fill="#E5F2E9"/>
  <text x="234" y="394" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle">动态引用</text>
  <rect x="296" y="372" width="76" height="34" rx="17" fill="#E8EEFB"/>
  <text x="334" y="394" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">道具</text>
  <rect x="384" y="372" width="76" height="34" rx="17" fill="#E5F2E9"/>
  <text x="422" y="394" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle">状态</text>
  <rect x="472" y="372" width="76" height="34" rx="17" fill="#E8EEFB"/>
  <text x="510" y="394" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">技能</text>
  <rect x="560" y="372" width="100" height="34" rx="17" fill="#E5F2E9"/>
  <text x="610" y="394" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle">单位状态</text>
  <text x="72" y="426" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#8B8DA0">根据所选图片源类型不同，后续配置参数也随之变化</text>

  <!-- 四、静态引用详细配置 -->
  <rect x="48" y="460" width="1104" height="272" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="492" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">四、静态引用详细配置</text>
  <text x="72" y="522" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">引用素材资产：</text>
  <text x="220" y="522" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">选择预设素材，部分素材支持配置颜色</text>
  <text x="72" y="550" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">填充颜色：</text>
  <text x="220" y="550" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">资产分单色与彩色两类，可通过选色器修改资产颜色</text>
  <text x="72" y="578" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">图片类型：</text>
  <text x="220" y="578" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">支持基础、拉伸两种；部分图片资产具有拉伸属性，可在图片资产库中筛选查找</text>

  <rect x="72" y="596" width="1056" height="36" rx="8" fill="#2D6BE4"/>
  <text x="92" y="619" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">图片属性</text>
  <text x="260" y="619" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">特性</text>
  <text x="640" y="619" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">常见用途</text>

  <rect x="72" y="636" width="1056" height="30" fill="#F6F4EE"/>
  <text x="92" y="656" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">普通</text>
  <text x="260" y="656" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">图片拉伸时四角会跟随形变</text>
  <text x="640" y="656" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">拼接特定形状或基础图案</text>

  <text x="92" y="686" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">三宫格</text>
  <text x="260" y="686" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">横向或纵向单向拉伸时，四角维持原有形状不变</text>
  <text x="640" y="686" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">自定义样式的按钮、页签项等控件的底板图片</text>

  <rect x="72" y="696" width="1056" height="30" fill="#F6F4EE"/>
  <text x="92" y="716" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">九宫格</text>
  <text x="260" y="716" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">横向或纵向拉伸时，四角都会保持原有形状不变</text>
  <text x="640" y="716" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">列表项底板，或页签、单选项视窗等控件的背景图片</text>

  <!-- 五、图片控件的颜色配置（7.0 新增） -->
  <rect x="48" y="748" width="1104" height="194" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="780" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">五、图片控件的颜色配置</text>
  <rect x="284" y="762" width="84" height="22" rx="11" fill="#E8EEFB"/>
  <text x="326" y="778" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">7.0 新增</text>
  <text x="72" y="812" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">所有图片源类型均支持配置颜色</text>
  <text x="300" y="812" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">静态引用、动态引用、道具、状态、技能、单位状态均可配置填充颜色</text>
  <text x="72" y="842" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">静态引用下，部分素材支持配置颜色；单色资产修改颜色时具有更好的表现，彩色资产改色效果相对有限</text>
  <rect x="72" y="862" width="1056" height="64" rx="10" fill="#FDE8E6"/>
  <rect x="72" y="862" width="4" height="64" rx="2" fill="#D93025"/>
  <text x="96" y="900" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#D93025">注意：</text>
  <text x="156" y="900" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#D93025">若图片源为「素材组」，则无法被填充颜色</text>

  <!-- 六、其他图片源类型 -->
  <rect x="48" y="958" width="540" height="150" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="990" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">六、其他图片源类型</text>
  <text x="72" y="1022" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">当图片源配置为动态引用、道具、状态、技能、单位状态时</text>
  <text x="72" y="1046" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">支持配置自定义变量，作为对应图片的标识使用</text>
  <text x="72" y="1070" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">运行时依据变量值动态切换所显示的图片</text>

  <!-- 七、拉伸属性资产查找 -->
  <rect x="612" y="958" width="540" height="150" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="636" y="990" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">七、拉伸属性资产查找</text>
  <text x="636" y="1022" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">图片类型支持「基础」「拉伸」两种配置</text>
  <text x="636" y="1046" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">部分图片资产具有拉伸属性</text>
  <text x="636" y="1070" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可通过图片资产库中的筛选项进行查找</text>

  <!-- 相关文档：标签（单独一行） -->
  <text x="48" y="1124" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">相关文档：</text>
  <!-- 来源链接（另起一行，蓝色可点击） -->
  <a xlink:href="https://act.mihoyo.com/ys/ugc/tutorial/detail/mh2oih9jou22" target="_blank">
    <text x="48" y="1146" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-decoration="underline">奇匠学院文档：图片控件</text>
  </a>
  <!-- 页脚 -->
  <text x="600" y="1168" text-anchor="middle" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">由 AI 基于官方奇匠学院文档生成。版本：7.0</text>
</svg>
