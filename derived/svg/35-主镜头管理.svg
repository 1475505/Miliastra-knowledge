<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1720">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
    <filter id="elevated"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="1720" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  
  <!-- Title -->
  <rect x="40" y="30" width="1120" height="90" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="40" y="30" width="4" height="90" rx="2" fill="#2D6BE4"/>
  <text x="70" y="72" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">主镜头管理</text>
  <text x="70" y="100" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">镜头模板定义、五种镜头模式与运行时动态切换 -- 玩家视角控制核心</text>
  <!-- Section 1 -->
  <text x="60" y="155" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">一、镜头的定义</text>
  <rect x="60" y="170" width="1080" height="120" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="198" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">镜头是用于呈现玩家视角的工具，决定玩家看到的画面。</text>
  <text x="80" y="222" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">超限模式中支持通过定义镜头模板来定义镜头规则，每个镜头模板对应一种镜头状态。</text>
  <text x="80" y="246" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">入口：主镜头管理</text>
  <rect x="80" y="258" width="80" height="22" rx="11" fill="#E8EEFB"/><text x="94" y="274" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">镜头模板</text>
  <rect x="170" y="258" width="80" height="22" rx="11" fill="#E8EEFB"/><text x="184" y="274" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">镜头状态</text>
  <rect x="260" y="258" width="100" height="22" rx="11" fill="#FFF3E0"/><text x="274" y="274" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">超限模式可用</text>
  <!-- Section 2 -->
  <text x="60" y="325" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">二、镜头模板机制</text>
  <rect x="60" y="340" width="1080" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="368" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">每个玩家有唯一生效的镜头模板，不同玩家之间可生效不同模板。</text>
  <text x="80" y="392" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">运行时可通过节点图切换玩家实体的生效镜头模板，但无法动态修改模板内参数。</text>
  <text x="80" y="416" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">初始化时依赖玩家的职业进行赋予。</text>
  <rect x="80" y="440" width="120" height="22" rx="11" fill="#E8EEFB"/><text x="94" y="456" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">唯一生效模板</text>
  <rect x="210" y="440" width="120" height="22" rx="11" fill="#FFF3E0"/><text x="224" y="456" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">节点图可切换</text>
  <rect x="340" y="440" width="140" height="22" rx="11" fill="#FDE8E6"/><text x="354" y="456" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">参数不可动态修改</text>
  <rect x="490" y="440" width="120" height="22" rx="11" fill="#E5F2E9"/><text x="504" y="456" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">职业初始赋予</text>
  <!-- Section 3 -->
  <text x="60" y="515" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">三、编辑界面三部分</text>
  <rect x="60" y="530" width="340" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="90" cy="560" r="12" fill="#2D6BE4"/><text x="86" y="565" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#FFF" text-anchor="middle">1</text>
  <text x="112" y="562" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">参数配置</text>
  <text x="112" y="584" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">当前预览镜头模板的参数配置</text>
  <text x="112" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">位置、模式、生效目标等</text>
  <rect x="430" y="530" width="340" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="460" cy="560" r="12" fill="#2D6BE4"/><text x="456" y="565" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#FFF" text-anchor="middle">2</text>
  <text x="482" y="562" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">场景预览</text>
  <text x="482" y="584" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">场景内镜头位置和人物位置关系预览</text>
  <text x="482" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">实时查看空间关系</text>
  <rect x="800" y="530" width="340" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="830" cy="560" r="12" fill="#2D6BE4"/><text x="826" y="565" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#FFF" text-anchor="middle">3</text>
  <text x="852" y="562" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">画面预览</text>
  <text x="852" y="584" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">实际游戏运行时游戏画面预览</text>
  <text x="852" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">所见即所得</text>
  <!-- Section 4 -->
  <text x="60" y="665" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">四、镜头模板参数</text>
  <rect x="60" y="680" width="1080" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="698" width="200" height="44" rx="10" fill="#E8EEFB"/>
  <text x="100" y="716" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#2D6BE4">模板名称</text>
  <text x="100" y="734" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">命名，被节点图引用</text>
  <rect x="300" y="698" width="200" height="44" rx="10" fill="#FFF3E0"/>
  <text x="320" y="716" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">位置信息</text>
  <text x="320" y="734" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">镜头与角色相对位置详细参数</text>
  <rect x="520" y="698" width="200" height="44" rx="10" fill="#E5F2E9"/>
  <text x="540" y="716" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">移动模式</text>
  <text x="540" y="734" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">当前仅支持跟随角色实体</text>
  <rect x="740" y="698" width="200" height="44" rx="10" fill="#FDE8E6"/>
  <text x="760" y="716" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">模式</text>
  <text x="760" y="734" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">决定镜头主要规则</text>
  <rect x="80" y="758" width="300" height="44" rx="10" fill="#F9F7F2"/>
  <text x="100" y="776" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">默认生效目标</text>
  <text x="100" y="794" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">设置初始应用于哪些职业</text>
  <!-- Section 5 -->
  <text x="60" y="875" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">五、五种镜头模式</text>
  <!-- Mode 1: 经典镜头 -->
  <rect x="60" y="890" width="1080" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="905" width="100" height="28" rx="14" fill="#2D6BE4"/>
  <text x="100" y="924" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">经典镜头</text>
  <text x="200" y="924" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">与经典模式一致，参数不可修改</text>
  <rect x="200" y="936" width="100" height="22" rx="11" fill="#FDE8E6"/><text x="214" y="952" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">参数固定</text>
  <!-- Mode 2: 3D背镜头 -->
  <rect x="60" y="985" width="1080" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="1000" width="120" height="28" rx="14" fill="#2D6BE4"/>
  <text x="96" y="1019" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">3D背镜头</text>
  <text x="220" y="1019" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">越肩镜头，位于角色右后方</text>
  <text x="80" y="1052" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">可配置参数：</text>
  <rect x="80" y="1064" width="140" height="22" rx="11" fill="#E8EEFB"/><text x="94" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">镜头视野检测(FOV)</text>
  <rect x="230" y="1064" width="80" height="22" rx="11" fill="#E8EEFB"/><text x="244" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">视点偏移</text>
  <rect x="320" y="1064" width="100" height="22" rx="11" fill="#E8EEFB"/><text x="334" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">视点跟随旋转</text>
  <rect x="430" y="1064" width="80" height="22" rx="11" fill="#E8EEFB"/><text x="444" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">默认视距</text>
  <rect x="520" y="1064" width="80" height="22" rx="11" fill="#E8EEFB"/><text x="534" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">视距范围</text>
  <rect x="610" y="1064" width="110" height="22" rx="11" fill="#E8EEFB"/><text x="624" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">水平角度范围</text>
  <rect x="730" y="1064" width="110" height="22" rx="11" fill="#E8EEFB"/><text x="744" y="1080" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">俯仰角度范围</text>
  <text x="80" y="1120" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">参数最丰富的镜头模式，适合需要精细控制视角的3D关卡</text>
  <!-- Mode 3: 2.5D镜头 -->
  <rect x="60" y="1160" width="1080" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="1175" width="120" height="28" rx="14" fill="#2D6BE4"/>
  <text x="96" y="1194" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">2.5D镜头</text>
  <text x="220" y="1194" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">传统2.5D游戏镜头</text>
  <rect x="220" y="1206" width="140" height="22" rx="11" fill="#FFF3E0"/><text x="234" y="1222" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">忽略镜头碰撞(是/否)</text>
  <!-- Mode 4: 第一人称镜头 -->
  <rect x="60" y="1255" width="1080" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="1270" width="140" height="28" rx="14" fill="#2D6BE4"/>
  <text x="96" y="1289" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">第一人称镜头</text>
  <text x="240" y="1289" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">位于角色眼睛位置</text>
  <rect x="240" y="1301" width="120" height="22" rx="11" fill="#E5F2E9"/><text x="254" y="1317" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">沉浸式视角</text>
  <!-- Mode 5: 第三人称镜头 -->
  <rect x="60" y="1350" width="1080" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="1365" width="140" height="28" rx="14" fill="#2D6BE4"/>
  <text x="96" y="1384" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFF">第三人称镜头</text>
  <text x="240" y="1384" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">近似经典模式，支持修改详细设置</text>
  <rect x="240" y="1396" width="120" height="22" rx="11" fill="#E8EEFB"/><text x="254" y="1412" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">可自定义参数</text>
  <rect x="370" y="1396" width="140" height="22" rx="11" fill="#FFF3E0"/><text x="384" y="1412" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">经典模式增强版</text>
  <!-- Section 6 -->
  <text x="60" y="1465" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">六、镜头模板切换</text>
  <rect x="60" y="1480" width="1080" height="110" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="1508" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">使用节点图在运行时动态切换镜头模板。</text>
  <text x="80" y="1532" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">目标单位为玩家实体的列表。</text>
  <rect x="80" y="1548" width="120" height="22" rx="11" fill="#E8EEFB"/><text x="94" y="1564" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">节点图动态切换</text>
  <rect x="210" y="1548" width="140" height="22" rx="11" fill="#FFF3E0"/><text x="224" y="1564" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">目标为玩家实体列表</text>
