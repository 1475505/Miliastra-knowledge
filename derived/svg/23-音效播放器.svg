<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1050">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
    <filter id="elevated"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="1050" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  
  <!-- Title -->
  <rect x="40" y="30" width="1120" height="90" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="40" y="30" width="4" height="90" rx="2" fill="#2D6BE4"/>
  <text x="70" y="72" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">音效播放器</text>
  <text x="70" y="100" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">音效播放组件 -- 自动播放、节点图控制、3D音效与衰减方式</text>
  <!-- Section 1 -->
  <text x="60" y="155" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">一、音效播放器组件的功能</text>
  <rect x="60" y="170" width="1080" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="198" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">音效播放器组件提供让单位额外播放音效的功能，有两种播放方式：</text>
  <circle cx="95" cy="222" r="10" fill="#2D6BE4"/><text x="92" y="226" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">1</text>
  <text x="115" y="227" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">默认配置在组件上，单位创建后自动播放</text>
  <circle cx="95" cy="248" r="10" fill="#2D6BE4"/><text x="92" y="252" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">2</text>
  <text x="115" y="253" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">通过节点图播放，但要求播放单位持有音效播放器组件</text>
  <!-- Section 2: 编辑 -->
  <text x="60" y="305" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">二、音效播放器组件的编辑</text>
  <rect x="60" y="320" width="520" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="348" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">添加步骤</text>
  <circle cx="95" cy="370" r="10" fill="#2D6BE4"/><text x="92" y="374" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">1</text>
  <text x="115" y="375" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">切换到实体/元件的组件页签</text>
  <circle cx="95" cy="392" r="10" fill="#2D6BE4"/><text x="92" y="396" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">2</text>
  <text x="115" y="397" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">找到或新增音效播放器组件 > 详细编辑</text>
  <circle cx="95" cy="414" r="10" fill="#2D6BE4"/><text x="92" y="418" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">3</text>
  <text x="115" y="414" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">点击【添加音效】新增音效配置</text>
  <!-- 配置参数 -->
  <rect x="620" y="320" width="520" height="310" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="348" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">配置参数</text>
  <text x="640" y="372" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">序号：音效播放器的识别序号</text>
  <text x="640" y="392" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">名称：播放器的名称</text>
  <text x="640" y="412" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">音效资产：引用具体要播放的音效资产</text>
  <text x="640" y="432" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">音量：音效播放时的响度大小</text>
  <text x="640" y="452" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">播放速度：音效资产的播放速度</text>
  <text x="640" y="472" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">循环播放：开启后播放完毕后再次播放</text>
  <text x="640" y="492" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">循环时间间隔(s)：循环播放结束后等待间隔再播放</text>
  <text x="640" y="516" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">3D音效配置：</text>
  <text x="640" y="536" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">3D音效：勾选后可配置相关参数</text>
  <text x="640" y="556" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">范围预览：开启后场景内显示音效传播范围</text>
  <text x="640" y="576" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">范围半径(m)：音效传播的范围大小</text>
  <text x="640" y="596" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">挂接点：指定挂接点位置作为音源位置</text>
  <text x="640" y="616" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">偏移：音源的位置偏移</text>
  <!-- 衰减方式 -->
  <text x="60" y="455" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">三、3D音效衰减方式</text>
  <rect x="60" y="470" width="520" height="130" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="498" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">3D音效下，听者距音源越远音量越小，直至超出范围后音量为0。</text>
  <text x="80" y="522" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">衰减方式决定音量变小的趋势：</text>
  <rect x="80" y="538" width="100" height="22" rx="11" fill="#E8EEFB"/><text x="94" y="554" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">均匀衰减</text>
  <text x="190" y="554" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">线性关系</text>
  <rect x="80" y="566" width="100" height="22" rx="11" fill="#FFF3E0"/><text x="94" y="582" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">先快后慢</text>
  <text x="190" y="582" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">近处远离时衰减更快</text>
  <rect x="310" y="566" width="100" height="22" rx="11" fill="#E5F2E9"/><text x="324" y="582" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">先慢后快</text>
  <text x="420" y="582" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">近处远离时衰减更慢</text>
  <!-- Section 4: 节点图 -->
  <text x="60" y="640" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">四、节点图控制音效</text>
  <rect x="60" y="655" width="1080" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="670" width="200" height="44" rx="10" fill="#E8EEFB"/>
  <text x="100" y="690" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#2D6BE4">添加音效播放器</text>
  <text x="100" y="706" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">动态添加音效播放器</text>
  <rect x="300" y="670" width="200" height="44" rx="10" fill="#FFF3E0"/>
  <text x="320" y="690" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">调整指定音效播放器</text>
  <text x="320" y="706" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">修改播放器参数</text>
  <rect x="520" y="670" width="200" height="44" rx="10" fill="#FDE8E6"/>
  <text x="540" y="690" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">关闭指定音效播放器</text>
  <text x="540" y="706" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">停止播放器</text>
  <rect x="740" y="670" width="200" height="44" rx="10" fill="#E5F2E9"/>
  <text x="760" y="690" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#1A1B2E">启动/暂停指定播放器</text>
  <text x="760" y="706" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">控制播放/暂停状态</text>
  <rect x="80" y="730" width="300" height="44" rx="10" fill="#E8EEFB"/>
  <text x="100" y="750" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#2D6BE4">玩家播放单次2D音效</text>
  <text x="100" y="766" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#4A4B65">无需组件，直接播放一次性2D音效</text>
  <!-- 要点 -->
  <text x="80" y="800" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">要点：</text>
  <text x="80" y="800" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">节点图播放音效要求单位持有组件 | 3D音效距离越远音量越小 | 循环播放可配置间隔时间</text>
  <!-- Source --><!-- 相关文档 -->
<text x="48" y="850" fill="#8B8DA0" font-size="12" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">相关文档：</text>
