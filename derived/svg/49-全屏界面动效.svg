  <rect width="1200" height="680" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  

  <rect x="40" y="30" width="1120" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="40" y="30" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="64" y="62" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">全屏界面动效控件</text>
  <text x="64" y="90" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">全屏覆盖特效 | 层级最高不可更改 | 视野氛围表现</text>

  <rect x="40" y="130" width="540" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">一、全屏界面动效的功能</text>
  <text x="60" y="188" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">全屏界面动效可配置在界面布局中，显示对应特效。</text>
  <text x="60" y="211" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">用于美化、丰富表现。</text>
  <text x="60" y="234" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">关卡运行中，可通过节点图唤起全屏界面动效。</text>
  <rect x="60" y="255" width="160" height="24" rx="12" fill="#E8EEFB"/>
  <text x="75" y="272" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">界面控件组编辑窗口添加</text>

  <rect x="620" y="130" width="540" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">二、编辑参数</text>
  <text x="640" y="190" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">选择界面动效</text>
  <text x="640" y="213" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">选中需要展示在界面布局中的特效资产</text>
  <text x="640" y="240" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">是否播放音效</text>
  <text x="640" y="263" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">选「是」则同步播放该资产自带的音效</text>

  <rect x="40" y="310" width="1120" height="180" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="340" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">三、与界面动效的区别</text>

  <rect x="60" y="360" width="500" height="36" rx="8" fill="#E8EEFB"/>
  <text x="80" y="383" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">对比项</text>
  <text x="280" y="383" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">全屏界面动效</text>
  <text x="440" y="383" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">界面动效</text>

  <text x="80" y="415" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">层级</text>
  <text x="280" y="415" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">默认最高且不可更改</text>
  <text x="440" y="415" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">可选控件之上/之下</text>

  <text x="80" y="441" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">覆盖范围</text>
  <text x="280" y="441" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">覆盖全屏，不可修改</text>
  <text x="440" y="441" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">指定位置显示</text>

  <text x="80" y="467" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#1A1B2E">典型用途</text>
  <text x="280" y="467" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">视野氛围表现效果</text>
  <text x="440" y="467" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">局部美化与丰富表现</text>

  <rect x="40" y="510" width="1120" height="90" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="540" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">四、通过节点图管理</text>
  <text x="60" y="570" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">使用「播放界面动效控件」节点，可在关卡运行中按需播放全屏界面动效。</text>

