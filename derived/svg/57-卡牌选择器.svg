<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1100">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="1200" height="1100" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  

  <rect x="40" y="30" width="1120" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="40" y="30" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="64" y="62" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">卡牌选择器界面控件</text>
  <text x="64" y="90" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">决策交互界面 | 决策时间/表现/交互方式 | 已知/未知卡牌</text>

  <rect x="40" y="130" width="540" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">一、卡牌选择器的功能</text>
  <text x="60" y="188" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">提供编辑简单的决策交互界面功能。</text>
  <text x="60" y="211" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可通过默认配置/节点图唤起。</text>
  <text x="60" y="234" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">超时/交互后向节点图发送「决策弹窗完成事件」。</text>
  <rect x="60" y="248" width="160" height="24" rx="12" fill="#E8EEFB"/>
  <text x="75" y="265" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">默认为界面控件组</text>

  <rect x="620" y="130" width="540" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">二、可见性与变换</text>
  <text x="640" y="190" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">索引</text>
  <text x="740" y="190" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">用于唤起卡牌选择器节点的入参</text>
  <text x="640" y="218" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">初始可见</text>
  <text x="740" y="218" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">不勾选则激活后不可见，节点图可调整</text>
  <text x="640" y="246" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">位置/层级</text>
  <text x="740" y="246" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">支持手写/拖动调整，大小不支持配置</text>

  <rect x="40" y="290" width="1120" height="280" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="320" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">三、决策面板配置</text>

  <rect x="60" y="340" width="340" height="100" rx="10" fill="#E8EEFB"/>
  <text x="80" y="365" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">页面设置</text>
  <text x="80" y="388" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">显示标题/标题文本</text>
  <text x="80" y="411" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">界面布局：列表/网格两种样式</text>
  <text x="80" y="434" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">显示已选择数量/可重置次数</text>

  <rect x="420" y="340" width="340" height="100" rx="10" fill="#FFF3E0"/>
  <text x="440" y="365" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#E65100">时间显示</text>
  <text x="440" y="388" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">显示剩余时间(s)：倒计时结束自动关闭</text>
  <text x="440" y="411" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">结束前预警时间(s)：红色闪烁提示</text>
  <text x="440" y="434" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">完成交互后遵从决策完成样式配置</text>

  <rect x="780" y="340" width="340" height="100" rx="10" fill="#E5F2E9"/>
  <text x="800" y="365" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2E7D32">其他设置</text>
  <text x="800" y="388" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">单人游玩时暂停游戏</text>
  <text x="800" y="411" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">控件可收起：暂不处理/后续处理</text>
  <text x="800" y="434" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">可放弃选择：触发主动关闭事件</text>

  <text x="60" y="470" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">已知卡牌设置：</text>
  <text x="220" y="470" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">显示卡牌图标/标题/描述</text>
  <text x="60" y="498" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">未知卡牌设置：</text>
  <text x="220" y="498" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">仅问号图标，选择后展示结果/结果页关闭方式(倒计时/手动)</text>
  <text x="60" y="526" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">卡牌库设置：</text>
  <text x="220" y="526" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">卡牌序号(从1递增)/类型(已知/未知)/图标/标题/描述/标签颜色/标签描述</text>
  <text x="60" y="554" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">未知卡牌推荐搭配「选择后展示结果」及「倒计时关闭」一同使用。</text>

  <rect x="40" y="590" width="1120" height="120" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="620" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">四、选项配置 - 卡牌库</text>

  <rect x="60" y="640" width="500" height="36" rx="8" fill="#E8EEFB"/>
  <text x="80" y="663" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="700" fill="#2D6BE4">配置参数</text>
  <text x="320" y="663" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="700" fill="#2D6BE4">说明</text>

  <text x="80" y="693" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#1A1B2E">卡牌序号</text>
  <text x="320" y="693" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">节点图唤起时的卡牌显示调用标识，从1递增不可修改</text>

  <rect x="40" y="730" width="1120" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="760" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">五、通过节点图管理</text>
  <rect x="60" y="778" width="140" height="24" rx="12" fill="#E8EEFB"/>
  <text x="75" y="795" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">唤起卡牌选择器</text>
  <rect x="210" y="778" width="140" height="24" rx="12" fill="#FFF3E0"/>
  <text x="225" y="795" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#E65100">关闭卡牌选择器</text>
  <rect x="360" y="778" width="180" height="24" rx="12" fill="#E5F2E9"/>
  <text x="375" y="795" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2E7D32">卡牌选择器完成时</text>
  <rect x="550" y="778" width="200" height="24" rx="12" fill="#FDE8E6"/>
  <text x="565" y="795" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#C62828">随机卡牌选择器列表</text>

  <text x="600" y="1070" text-anchor="middle" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">由 AI 基于官方奇匠学院文档生成。版本：月之七</text><!-- 相关文档 -->
