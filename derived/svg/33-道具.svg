<text x="216" y="228" fill="#E65100" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">材料</text>
<rect x="254" y="212" width="60" height="22" rx="11" fill="#E5F2E9"/>
<text x="284" y="228" fill="#2E7D32" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">消耗品</text>
<rect x="328" y="212" width="72" height="22" rx="11" fill="#FDE8E6"/>
<text x="364" y="228" fill="#C62828" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">贵重物品</text>

<!-- Section 2 -->
<text x="48" y="284" fill="#2D6BE4" font-size="18" font-weight="700" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">二、道具编辑入口与基础信息</text>

<rect x="48" y="302" width="1104" height="72" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="302" width="4" height="72" rx="2" fill="#2D6BE4"/>
