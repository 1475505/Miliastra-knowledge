<text x="72" y="72" fill="#1A1B2E" font-size="34" font-weight="bold" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">道具</text>
<text x="148" y="72" fill="#4A4B65" font-size="16" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">道具的定义、分类、基础/掉落/交互设置详解</text>

<!-- Section 1 -->
<text x="48" y="152" fill="#2D6BE4" font-size="18" font-weight="700" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">一、道具的定义与分类</text>

<rect x="48" y="170" width="1104" height="72" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="170" width="4" height="72" rx="2" fill="#2D6BE4"/>
<text x="72" y="200" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">道具是玩家可在局内获取、使用或装备的虚拟物品，由道具背包作为容器进行统一管理。</text>
<text x="72" y="226" fill="#1A1B2E" font-size="14" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">分类：</text>
