<line x1="700" y1="622" x2="700" y2="642" stroke="#E8E4DA"/>

<!-- Section 4: 掉落设置 -->
<text x="48" y="694" fill="#2D6BE4" font-size="18" font-weight="700" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">四、掉落设置</text>

