<text x="72" y="822" fill="#4A4B65" font-size="13" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">保留：击倒时保留在背包内</text>
<text x="72" y="842" fill="#8B8DA0" font-size="12" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">保留仅对角色有意义</text>

<rect x="416" y="712" width="352" height="140" rx="14" fill="#fff" filter="url(#card)"/>
