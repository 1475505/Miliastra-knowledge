<text x="440" y="782" fill="#4A4B65" font-size="13" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">全员一份：共享，一人拾取他人不可</text>
<text x="440" y="802" fill="#4A4B65" font-size="13" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">每人一份：各自独立掉落互不干扰</text>
<text x="440" y="842" fill="#8B8DA0" font-size="12" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">配置掉落物元件作为外形</text>

<rect x="784" y="712" width="368" height="140" rx="14" fill="#fff" filter="url(#card)"/>
