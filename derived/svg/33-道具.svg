<text x="72" y="358" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">道具名称（界面显示）| 道具图标（界面图标）| 配置ID（模板唯一标识，节点图引用）</text>

