  </a>
  <text x="600" y="1633" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" text-anchor="middle" fill="#8B8DA0">由 AI 基于官方奇匠学院文档生成。版本：月之七</text>
</svg>
