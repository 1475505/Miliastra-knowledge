<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
    <filter id="elevated"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="680" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  
  <!-- Title -->
  <rect x="40" y="30" width="1120" height="90" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="40" y="30" width="4" height="90" rx="2" fill="#2D6BE4"/>
  <text x="70" y="72" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">自定义挂接点</text>
  <text x="70" y="100" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">实体骨骼/结构上的自定义位置点 -- 用于附加单位或特效</text>
  <!-- Section 1 -->
  <text x="60" y="155" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">一、自定义挂接点组件的功能</text>
  <rect x="60" y="170" width="1080" height="130" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="198" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">挂接点是在实体的骨骼或结构上指定的特定位置，用于附加其他单位或特效。</text>
  <text x="80" y="222" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">自定义挂接点组件允许创作者自由选择位置作为单位的挂接点。</text>
  <text x="80" y="246" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">此类挂接点添加后，对中心原点的偏移是固定的，不会随实体骨骼运动而改变相对偏移。</text>
  <rect x="80" y="262" width="200" height="22" rx="11" fill="#E8EEFB"/><text x="94" y="278" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#2D6BE4">可同时添加多个挂接点</text>
  <rect x="290" y="262" width="200" height="22" rx="11" fill="#FFF3E0"/><text x="304" y="278" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">偏移固定，不随骨骼运动</text>
  <!-- Section 2: 编辑 -->
  <text x="60" y="335" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">二、自定义挂接点组件的编辑</text>
  <rect x="60" y="350" width="520" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="378" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">添加步骤</text>
  <circle cx="95" cy="400" r="10" fill="#2D6BE4"/><text x="92" y="404" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">1</text>
  <text x="115" y="405" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">实体/元件编辑界面 > 组件页签</text>
  <circle cx="95" cy="422" r="10" fill="#2D6BE4"/><text x="92" y="426" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">2</text>
  <text x="115" y="427" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">添加通用组件 > 选择"自定义挂接点"</text>
  <circle cx="95" cy="444" r="10" fill="#2D6BE4"/><text x="92" y="448" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">3</text>
  <text x="115" y="449" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">点击"详细编辑"展开编辑页</text>
  <circle cx="95" cy="466" r="10" fill="#2D6BE4"/><text x="92" y="470" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="10" fill="#FFF" text-anchor="middle">4</text>
  <text x="115" y="471" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">点击【添加自定义挂接点】新增</text>
  <rect x="620" y="350" width="520" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="378" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">配置参数</text>
  <text x="640" y="406" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">挂接点名称：可被其他系统直接引用的命名</text>
  <text x="640" y="432" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">偏移：对元件或实体中心原点的位置偏移</text>
  <text x="640" y="458" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">旋转：对元件或实体中心原点的朝向偏移</text>
  <!-- Section 3: 用途 -->
  <text x="60" y="525" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">三、常见用途</text>
  <rect x="60" y="540" width="1080" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="80" y="555" width="140" height="24" rx="12" fill="#E8EEFB"/><text x="95" y="572" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">特效播放挂接位置</text>
  <rect x="230" y="555" width="140" height="24" rx="12" fill="#E8EEFB"/><text x="245" y="572" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">铭牌/气泡基准点</text>
  <rect x="380" y="555" width="140" height="24" rx="12" fill="#E8EEFB"/><text x="395" y="572" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">音效音源位置</text>
  <rect x="530" y="555" width="160" height="24" rx="12" fill="#E8EEFB"/><text x="545" y="572" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">预设点跟随实体移动</text>
  <rect x="700" y="555" width="160" height="24" rx="12" fill="#E8EEFB"/><text x="715" y="572" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">扫描标签检测基准点</text>
  <text x="80" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#8B8DA0">挂接点名称可被特效播放、铭牌、文本气泡、音效播放器、扫描标签等系统直接引用。</text>
  <!-- Source --><!-- 相关文档 -->
