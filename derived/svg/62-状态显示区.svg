<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1474">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D6BE4"/>
      <stop offset="100%" stop-color="#4A3F6B"/>
    </linearGradient>
    <filter id="card">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/>
    </filter>
    <filter id="elevated">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="1474" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>

  <rect x="48" y="30" width="1104" height="80" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="48" y="30" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="72" y="72" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">状态显示区控件</text>
  <text x="72" y="96" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">监听实体单位状态 · 自定义样式展示 · 仅供信息展示不可交互</text>

  <rect x="48" y="126" width="1104" height="136" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="158" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" fill="#2D6BE4">一、状态显示区的功能</text>
  <circle cx="88" cy="190" r="3" fill="#2D6BE4"/>
  <text x="102" y="195" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可配置在界面布局中，监听实体上的单位状态，并按自定义样式进行展示</text>
  <circle cx="88" cy="218" r="3" fill="#2D6BE4"/>
  <text x="102" y="223" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">仅供信息展示使用，不可交互</text>
  <circle cx="88" cy="246" r="3" fill="#2D6BE4"/>
  <text x="102" y="251" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">与消息队列不同，状态项加入/移出队列时，不附带额外动画表现</text>

  <rect x="48" y="278" width="1104" height="156" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="310" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" fill="#2D6BE4">二、状态显示区的编辑</text>
  <text x="72" y="344" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">添加状态显示区</text>
  <text x="232" y="344" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">在界面控件组编辑窗口中，添加「界面控件模板-状态显示区」</text>
  <text x="72" y="376" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">状态项样式设置</text>
  <text x="232" y="376" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">与页签/单选项视窗类似，可在样式设置中定制状态项样式</text>
  <text x="232" y="404" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">点击【详情编辑】在状态项素材组中加入任意素材，如界面动效，新状态项加入时触发播放以提示更新</text>

  <rect x="48" y="450" width="1104" height="314" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="482" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" fill="#2D6BE4">三、状态显示区功能设置</text>
  <text x="72" y="514" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">初始填充点</text>
  <text x="240" y="514" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">第一个状态项加入队列时的初始填充位置</text>
  <text x="72" y="544" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">填充方向</text>
  <text x="240" y="544" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">状态项的填充方向（横向 / 纵向）</text>
  <text x="72" y="574" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">新状态插入位置</text>
  <text x="240" y="574" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可搭配【填充方向】【初始填充点】参数实现不同效果</text>
  <text x="72" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">对齐</text>
  <text x="240" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">与文本框对齐类似，设置所有状态项关于父级控件的上下左右对齐方式</text>
  <text x="72" y="636" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">示例（排列限制=自动换行时）：</text>
  <rect x="72" y="652" width="516" height="92" rx="10" fill="#E8EEFB"/>
  <text x="96" y="678" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="700" fill="#2D6BE4">示例一 · 从上到下填充</text>
  <text x="96" y="702" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">初始填充点=左上 · 填充方向=纵向 · 新状态插入=队列结尾</text>
  <text x="96" y="726" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">状态加入队列时，从上到下进行填充</text>
  <rect x="612" y="652" width="516" height="92" rx="10" fill="#FFF3E0"/>
  <text x="636" y="678" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="700" fill="#1A1B2E">示例二 · 从下到上填充</text>
  <text x="636" y="702" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">初始填充点=左下 · 填充方向=纵向 · 新状态插入=队列开头</text>
  <text x="636" y="726" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">状态加入队列时，从下到上进行填充</text>

  <rect x="48" y="780" width="1104" height="174" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="812" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" fill="#2D6BE4">四、排列限制注意事项</text>
  <text x="72" y="842" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">与消息队列控件不同，状态显示区的【排列限制】参数会受到状态项填充方向的影响</text>
  <rect x="72" y="862" width="96" height="28" rx="14" fill="#E8EEFB"/>
  <text x="120" y="881" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">固定行数</text>
  <text x="184" y="881" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">状态项优先填充满当前列，再换列填充</text>
  <rect x="72" y="902" width="96" height="28" rx="14" fill="#E8EEFB"/>
  <text x="120" y="921" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-anchor="middle">固定列数</text>
  <text x="184" y="921" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">状态项优先填充满当前行，再换行填充</text>

  <rect x="48" y="970" width="1104" height="192" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="1002" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" fill="#2D6BE4">五、状态项显示步骤（以下三条需同时满足）</text>
  <rect x="72" y="1026" width="336" height="116" rx="10" fill="#E8EEFB"/>
  <circle cx="106" cy="1084" r="14" fill="#2D6BE4"/>
  <text x="106" y="1089" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="134" y="1068" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">确定监听实体对象</text>
  <text x="134" y="1092" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">功能页签 → 状态项配置</text>
  <text x="134" y="1112" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">指定监听的实体对象</text>
  <rect x="424" y="1026" width="336" height="116" rx="10" fill="#FFF3E0"/>
  <circle cx="458" cy="1084" r="14" fill="#2D6BE4"/>
  <text x="458" y="1089" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="486" y="1068" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">关联单位状态</text>
  <text x="486" y="1092" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">点击【详情编辑】打开界面</text>
  <text x="486" y="1112" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">【关联单位状态】选择要显示的单位状态</text>
  <rect x="776" y="1026" width="336" height="116" rx="10" fill="#E5F2E9"/>
  <circle cx="810" cy="1084" r="14" fill="#1B4FC0"/>
  <text x="810" y="1089" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="838" y="1068" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">添加控件推送</text>
  <text x="838" y="1092" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">单位状态配置添加「状态显示区</text>
  <text x="838" y="1112" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#4A4B65">添加状态」效果并选择目标控件</text>

  <rect x="48" y="1178" width="1104" height="216" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="1208" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" fill="#2D6BE4">六、额外说明（7.0 新增）</text>
  <rect x="72" y="1224" width="1056" height="96" rx="10" fill="#E8EEFB"/>
  <rect x="72" y="1224" width="4" height="96" rx="2" fill="#2D6BE4"/>
  <text x="96" y="1252" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">新增「施加来源不同时堆叠显示」开关：关闭堆叠显示后，不同槽位的同类型单位状态会区分显示</text>
  <text x="96" y="1278" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#2D6BE4">需与特殊数字控件的「监听父级」模式配合使用</text>
  <rect x="72" y="1342" width="96" height="28" rx="14" fill="#E5F2E9"/>
  <text x="120" y="1361" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2E7D32" text-anchor="middle">经典模式</text>
  <text x="184" y="1361" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">也可以配置特殊数字控件</text>

  <text x="48" y="1420" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">相关文档：</text>
  <a xlink:href="https://act.mihoyo.com/ys/ugc/tutorial/detail/mh4ve00q4j14" target="_blank">
    <text x="48" y="1438" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-decoration="underline">奇匠学院文档：状态显示区控件</text>
  </a>
  <text x="600" y="1460" text-anchor="middle" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#8B8DA0">由 AI 基于官方奇匠学院文档生成。版本：7.0</text>
</svg>
