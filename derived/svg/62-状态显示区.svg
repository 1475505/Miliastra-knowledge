<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 950">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="1200" height="950" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  

  <rect x="40" y="30" width="1120" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="40" y="30" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="64" y="62" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">状态显示区控件</text>
  <text x="64" y="90" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">监听实体单位状态 | 自定义样式展示 | 仅供信息展示不可交互</text>

  <rect x="40" y="130" width="540" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">一、状态显示区的功能</text>
  <text x="60" y="188" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可配置在界面布局中，监听实体上的单位状态，</text>
  <text x="60" y="211" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">并按照自定义样式进行展示。</text>
  <text x="60" y="238" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">仅供信息展示使用，不可交互。</text>
  <text x="60" y="265" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">与消息队列不同，状态项加入/移出队列时无额外动画。</text>
  <rect x="60" y="278" width="80" height="24" rx="12" fill="#FDE8E6"/>
  <text x="75" y="295" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#C62828">不可交互</text>

  <rect x="620" y="130" width="540" height="160" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">二、状态项样式设置</text>
  <text x="640" y="188" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">与页签/单选项视窗类似，可定制状态项样式。</text>
  <text x="640" y="215" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">点击【详情编辑】在状态项素材组中加入任意素材。</text>
  <text x="640" y="242" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可添加界面动效，新状态项加入时触发播放提示更新。</text>
  <rect x="640" y="260" width="120" height="24" rx="12" fill="#E8EEFB"/>
  <text x="655" y="277" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">素材组自定义</text>

  <rect x="40" y="310" width="1120" height="280" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="340" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">三、功能设置</text>

  <text x="60" y="370" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">初始填充点</text>
  <text x="200" y="370" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">第一个状态项加入队列时的初始填充位置</text>

  <text x="60" y="400" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">填充方向</text>
  <text x="200" y="400" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">状态项的填充方向（横向/纵向）</text>

  <text x="60" y="430" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">新状态插入位置</text>
  <text x="200" y="430" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">搭配填充方向和初始填充点实现不同效果</text>

  <text x="60" y="460" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">对齐</text>
  <text x="200" y="460" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">所有状态项关于父级控件的上下左右对齐方式</text>

  <!-- Examples -->
  <rect x="60" y="480" width="520" height="90" rx="10" fill="#E8EEFB"/>
  <text x="80" y="505" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="700" fill="#2D6BE4">示例一：从上到下填充</text>
  <text x="80" y="528" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">初始填充点=左上，填充方向=纵向，新状态插入=队列结尾</text>
  <text x="80" y="551" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">状态加入队列时从上到下填充</text>

  <rect x="600" y="480" width="520" height="90" rx="10" fill="#FFF3E0"/>
  <text x="620" y="505" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="700" fill="#E65100">示例二：从下到上填充</text>
  <text x="620" y="528" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">初始填充点=左下，填充方向=纵向，新状态插入=队列开头</text>
  <text x="620" y="551" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">状态加入队列时从下到上填充</text>

  <rect x="40" y="610" width="1120" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="640" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">四、排列限制注意事项</text>
  <text x="60" y="668" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">排列限制=固定行数时，状态项优先填充满当前列，再换列填充。</text>
  <text x="60" y="695" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">排列限制=固定列数时，状态项优先填充满当前行，再换行填充。</text>

  <rect x="40" y="730" width="1120" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="760" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">五、状态项显示三步骤（需同时满足）</text>

  <rect x="60" y="780" width="340" height="70" rx="10" fill="#E8EEFB"/>
  <text x="80" y="805" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2D6BE4">一、确定监听实体对象</text>
  <text x="80" y="828" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">功能页签中指定监听实体</text>

  <rect x="420" y="780" width="340" height="70" rx="10" fill="#FFF3E0"/>
  <text x="440" y="805" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#E65100">二、关联单位状态</text>
  <text x="440" y="828" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">详情编辑中选择需要显示的单位状态</text>

  <rect x="780" y="780" width="340" height="70" rx="10" fill="#E5F2E9"/>
  <text x="800" y="805" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#2E7D32">三、添加控件推送</text>
  <text x="800" y="828" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">单位状态中添加「状态显示区添加状态」效果</text>

  <text x="600" y="920" text-anchor="middle" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">由 AI 基于官方奇匠学院文档生成。版本：月之七</text><!-- 相关文档 -->
<text x="48" y="920" fill="#8B8DA0" font-size="12" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">相关文档：</text>
<a xlink:href="https://act.mihoyo.com/ys/ugc/tutorial/detail/mh4ve00q4j14" target="_blank">
  <text x="48" y="940" fill="#2D6BE4" font-size="12" text-decoration="underline" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">奇匠学院文档：来源：状态显示区控件</text>
</a>
</svg>