<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1166">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
    <filter id="elevated"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="1166" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>

  <rect x="48" y="32" width="1104" height="80" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="48" y="32" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="72" y="66" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">特殊数字控件</text>
  <text x="72" y="94" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" fill="#4A4B65">技能数据可视化：冷却、次数、资源、可用状态</text>

  <rect x="48" y="128" width="1104" height="96" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="158" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">一、特殊数字的功能</text>
  <circle cx="84" cy="188" r="4" fill="#2D6BE4"/>
  <text x="100" y="192" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">特殊数字可配置在界面布局中，支持表现与技能相关的诸多数据</text>
  <circle cx="84" cy="212" r="4" fill="#2D6BE4"/>
  <text x="100" y="216" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">关卡运行中，可通过节点图唤起特殊数字控件</text>

  <rect x="48" y="240" width="1104" height="360" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="270" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">二、特殊数字的编辑</text>
  <circle cx="84" cy="300" r="14" fill="#2D6BE4"/>
  <text x="84" y="305" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="108" y="305" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="15" font-weight="500" fill="#1A1B2E">添加特殊数字</text>
  <text x="108" y="325" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">在界面控件组编辑窗口，添加界面控件模板「特殊数字」</text>

  <rect x="72" y="344" width="172" height="24" rx="12" fill="#E8EEFB"/>
  <text x="88" y="360" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" font-weight="500" fill="#2D6BE4">以下为选择技能时的配置项</text>

  <rect x="72" y="380" width="1056" height="34" rx="8" fill="#2D6BE4"/>
  <text x="100" y="402" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">配置参数</text>
  <text x="540" y="402" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">说明</text>

  <text x="100" y="436" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">数据来源</text>
  <text x="540" y="436" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">可选技能、道具、单位状态</text>
  <rect x="72" y="446" width="1056" height="32" fill="#F4F1EA"/>
  <text x="100" y="468" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">监听技能槽位</text>
  <text x="540" y="468" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">支持选择所有槽位，以槽位为基础监听技能</text>
  <text x="100" y="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">数据内容</text>
  <text x="540" y="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">技能冷却剩余时间、技能可用次数、技能资源、技能可用状态</text>
  <rect x="72" y="510" width="1056" height="32" fill="#F4F1EA"/>
  <text x="100" y="532" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">计时单位</text>
  <text x="540" y="532" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">可选秒、分钟、小时</text>
  <text x="100" y="564" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="500" fill="#1A1B2E">字号</text>
  <text x="540" y="564" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">对应数字显示的字号大小</text>

  <text x="48" y="640" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">三、数据来源与监听模式</text>
  <text x="286" y="640" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#8B8DA0">7.0 新增：经典模式支持配置；单位状态来源可选监听模式</text>

  <rect x="48" y="656" width="1104" height="48" rx="10" fill="#E8EEFB"/>
  <rect x="48" y="656" width="4" height="48" rx="2" fill="#2D6BE4"/>
  <text x="72" y="686" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#2D6BE4">经典模式也可以配置特殊数字控件了</text>
  <rect x="1016" y="666" width="88" height="28" rx="14" fill="#FFFFFF"/>
  <text x="1060" y="684" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" font-weight="500" fill="#2D6BE4" text-anchor="middle">7.0 新增</text>

  <rect x="48" y="720" width="544" height="176" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="72" y="752" width="120" height="30" rx="15" fill="#E8EEFB"/>
  <text x="132" y="771" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#2D6BE4" text-anchor="middle">监听实体变量</text>
  <text x="72" y="808" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">显示指定实体的指定单位状态的数据</text>
  <line x1="72" y1="842" x2="568" y2="842" stroke="#E8E4DA"/>
  <circle cx="80" cy="864" r="4" fill="#2D6BE4"/>
  <text x="92" y="868" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#1A1B2E">指定实体与单位状态，独立监听显示</text>

  <rect x="608" y="720" width="544" height="176" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="632" y="752" width="104" height="30" rx="15" fill="#FFF3E0"/>
  <text x="684" y="771" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="500" fill="#E65100" text-anchor="middle">监听父级</text>
  <text x="632" y="808" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">需与状态显示区控件配合使用</text>
  <text x="632" y="830" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">显示状态显示区分配的对应单位状态</text>
  <line x1="632" y1="842" x2="1128" y2="842" stroke="#E8E4DA"/>
  <circle cx="640" cy="864" r="4" fill="#2D6BE4"/>
  <text x="652" y="868" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#1A1B2E">不同来源的单位状态区分显示在不同槽位</text>

  <rect x="48" y="912" width="1104" height="168" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="72" y="942" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">四、注意事项</text>
  <circle cx="84" cy="972" r="4" fill="#2D6BE4"/>
  <text x="100" y="976" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">单位状态可配置「不同来源不叠加」，运行时同一单位状态的不同来源会被放入不同槽位</text>
  <rect x="72" y="994" width="1056" height="62" rx="10" fill="#FFF3E0"/>
  <rect x="72" y="994" width="4" height="62" rx="2" fill="#E65100"/>
  <text x="96" y="1018" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" font-weight="700" fill="#E65100">同一单位状态存在多个槽位时的显示规则：</text>
  <text x="96" y="1042" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">单位状态层数显示当前总层数；单位状态剩余可持续时间显示剩余时间最大值</text>

  <text x="48" y="1106" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#8B8DA0">相关文档：</text>
  <a xlink:href="https://act.mihoyo.com/ys/ugc/tutorial/detail/mhkwucr8awfq" target="_blank">
    <text x="48" y="1126" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4" text-decoration="underline">奇匠学院文档：特殊数字控件</text>
  </a>
  <text x="600" y="1148" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#8B8DA0" text-anchor="middle">由 AI 基于官方奇匠学院文档生成。版本：7.0</text>
</svg>
