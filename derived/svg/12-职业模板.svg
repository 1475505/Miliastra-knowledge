<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 2730">
<defs>
  <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#2D6BE4"/>
    <stop offset="100%" stop-color="#4A3F6B"/>
  </linearGradient>
  <filter id="card">
    <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/>
  </filter>
  <filter id="elevated">
    <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/>
  </filter>
</defs>
<style>
  text { font-family: 'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif; }
</style>

<rect width="1200" height="2730" fill="#F9F7F2"/>
<rect width="1200" height="6" fill="url(#topGrad)"/>

<!-- Title Card -->
<rect x="48" y="32" width="1104" height="80" rx="14" fill="#fff" filter="url(#elevated)"/>
<rect x="48" y="32" width="4" height="80" rx="2" fill="#2D6BE4"/>
<text x="72" y="72" fill="#1A1B2E" font-size="34" font-weight="bold">职业模板</text>
<text x="220" y="70" fill="#4A4B65" font-size="16">玩家属性配置核心 -- 决定角色初始属性、技能与行为</text>

<!-- ========== Section 一: 定义与功能 ========== -->
<text x="48" y="150" fill="#2D6BE4" font-size="18" font-weight="700">一、职业的定义与功能</text>

<rect x="48" y="168" width="540" height="240" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="168" width="4" height="240" rx="2" fill="#2D6BE4"/>
<text x="72" y="198" fill="#1A1B2E" font-size="16" font-weight="500">定义</text>

<text x="72" y="226" fill="#4A4B65" font-size="14">职业是玩家的一个属性，但主要影响单位是</text>
<text x="72" y="248" fill="#4A4B65" font-size="14">玩家的角色。</text>

<text x="72" y="278" fill="#4A4B65" font-size="14">职业决定了大部分玩家实体和角色实体的</text>
<text x="72" y="300" fill="#4A4B65" font-size="14">初始属性和技能。</text>

<text x="72" y="330" fill="#4A4B65" font-size="14">可用于区分不同玩家的玩法职责或分类，</text>
<text x="72" y="352" fill="#4A4B65" font-size="14">如能力、技能和发展路径等。</text>

<rect x="72" y="374" width="492" height="24" rx="8" fill="#E8EEFB"/>
<text x="84" y="391" fill="#2D6BE4" font-size="12" font-weight="500">编辑入口：战斗预设 > 职业页签</text>

<!-- Card: 核心功能 -->
<rect x="612" y="168" width="540" height="240" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="168" width="4" height="240" rx="2" fill="#2D6BE4"/>
<text x="636" y="198" fill="#1A1B2E" font-size="16" font-weight="500">核心功能：打包配置</text>

<text x="636" y="226" fill="#4A4B65" font-size="14">统筹和封装多个模块的功能，打包一整套配置。</text>

<text x="636" y="256" fill="#4A4B65" font-size="14">职业切换时统一修改玩家和角色身上的配置。</text>

<text x="636" y="286" fill="#4A4B65" font-size="14">除等级外，其他数据只在切换时进行一次覆写。</text>

<text x="636" y="316" fill="#4A4B65" font-size="14">后续仍可用节点图等方法修改玩家和角色数据。</text>

<rect x="636" y="340" width="492" height="52" rx="8" fill="#FFF3E0"/>
<text x="648" y="360" fill="#E65100" font-size="12" font-weight="500">示例：职业1将普攻替换为技能1，</text>
<text x="648" y="378" fill="#4A4B65" font-size="12">后续仍可用节点图将技能1替换为其他技能</text>

<!-- ========== Section 二: 基础设置 ========== -->
<text x="48" y="450" fill="#2D6BE4" font-size="18" font-weight="700">二、职业基础设置</text>

<rect x="48" y="468" width="1104" height="260" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="468" width="4" height="260" rx="2" fill="#2D6BE4"/>
<text x="72" y="498" fill="#1A1B2E" font-size="16" font-weight="500">基础参数配置</text>

<rect x="72" y="514" width="120" height="26" rx="13" fill="#2D6BE4"/>
<text x="132" y="532" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">选择镜头</text>
<text x="204" y="532" fill="#4A4B65" font-size="13">切换为该职业时，镜头被替换为配置的模板</text>

<rect x="72" y="548" width="120" height="26" rx="13" fill="#2D6BE4"/>
<text x="132" y="566" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">选择布局</text>
<text x="204" y="566" fill="#4A4B65" font-size="13">切换为该职业时，主屏布局被替换为配置的模板</text>

<rect x="72" y="582" width="160" height="26" rx="13" fill="#2D6BE4"/>
<text x="152" y="600" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">扫描标签识别规则</text>
<text x="244" y="600" fill="#4A4B65" font-size="13">在全部可用扫描物中筛选激活单位的规则</text>

<text x="72" y="630" fill="#4A4B65" font-size="13">视野中心距离：屏幕坐标系下，距屏幕中心越近优先级越高</text>
<text x="72" y="650" fill="#4A4B65" font-size="13">实际位置距离：世界坐标系下，距本地角色位置越近优先级越高</text>

<!-- Movement toggles -->
<text x="72" y="680" fill="#1A1B2E" font-size="14" font-weight="500">运动控制开关：</text>

<rect x="72" y="694" width="100" height="24" rx="12" fill="#E5F2E9"/>
<text x="122" y="711" fill="#2E7D32" font-size="11" text-anchor="middle" font-weight="500">允许跳跃</text>

<rect x="184" y="694" width="100" height="24" rx="12" fill="#E5F2E9"/>
<text x="234" y="711" fill="#2E7D32" font-size="11" text-anchor="middle" font-weight="500">允许冲刺</text>

<rect x="296" y="694" width="100" height="24" rx="12" fill="#E5F2E9"/>
<text x="346" y="711" fill="#2E7D32" font-size="11" text-anchor="middle" font-weight="500">允许攀爬</text>

<rect x="408" y="694" width="100" height="24" rx="12" fill="#E5F2E9"/>
<text x="458" y="711" fill="#2E7D32" font-size="11" text-anchor="middle" font-weight="500">允许滑翔</text>

<!-- ========== Section 三: 等级设置 ========== -->
<text x="48" y="770" fill="#2D6BE4" font-size="18" font-weight="700">三、等级设置</text>

<rect x="48" y="788" width="1104" height="260" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="788" width="4" height="260" rx="2" fill="#2D6BE4"/>
<text x="72" y="818" fill="#1A1B2E" font-size="16" font-weight="500">职业等级系统</text>

<text x="72" y="846" fill="#4A4B65" font-size="14">职业等级可近似看做角色等级，职业切换时角色等级同步变化。</text>

<text x="72" y="876" fill="#4A4B65" font-size="14">单次游玩中，玩家可切换多个职业，各职业等级会被记录。</text>
<text x="72" y="898" fill="#4A4B65" font-size="14">例：职业1为5级 -> 切换职业2 -> 切回职业1时仍为5级，经验也恢复。</text>

<text x="72" y="928" fill="#4A4B65" font-size="14">玩家模板上可覆写一次初始职业的创建等级，关卡初始化时设置。</text>

<rect x="72" y="950" width="120" height="26" rx="13" fill="#FFF3E0"/>
<text x="132" y="968" fill="#E65100" font-size="12" text-anchor="middle" font-weight="500">等级</text>
<text x="204" y="968" fill="#4A4B65" font-size="13">首次切换为该职业时的初始等级</text>

<rect x="72" y="984" width="120" height="26" rx="13" fill="#FFF3E0"/>
<text x="132" y="1002" fill="#E65100" font-size="12" text-anchor="middle" font-weight="500">最高等级</text>
<text x="204" y="1002" fill="#4A4B65" font-size="13">该职业可达到的最高等级</text>

<text x="72" y="1032" fill="#1A1B2E" font-size="13" font-weight="500">升级经验（两种方式）：</text>

<rect x="72" y="1046" width="120" height="24" rx="12" fill="#E8EEFB"/>
<text x="132" y="1063" fill="#2D6BE4" font-size="11" text-anchor="middle" font-weight="500">线性公式</text>
<text x="204" y="1063" fill="#4A4B65" font-size="12">该等级升级经验 = 当前等级 * 常数1 + 常数2</text>

<!-- ========== Section 四: 基础战斗属性 ========== -->
<text x="48" y="1090" fill="#2D6BE4" font-size="18" font-weight="700">四、基础战斗属性</text>

<rect x="48" y="1108" width="1104" height="300" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="1108" width="4" height="300" rx="2" fill="#2D6BE4"/>
<text x="72" y="1138" fill="#1A1B2E" font-size="16" font-weight="500">战斗属性（直接作用于角色，玩家模板不可配置）</text>

<rect x="72" y="1154" width="120" height="26" rx="13" fill="#2D6BE4"/>
<text x="132" y="1172" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">基础生命值</text>
<text x="204" y="1172" fill="#4A4B65" font-size="13">不叠加属性成长时的默认生命值</text>

<rect x="72" y="1188" width="120" height="26" rx="13" fill="#2D6BE4"/>
<text x="132" y="1206" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">基础攻击力</text>
<text x="204" y="1206" fill="#4A4B65" font-size="13">不叠加属性成长时的默认攻击力</text>

<rect x="72" y="1222" width="120" height="26" rx="13" fill="#2D6BE4"/>
<text x="132" y="1240" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">基础防御力</text>
<text x="204" y="1240" fill="#4A4B65" font-size="13">不叠加属性成长时的默认防御力</text>

<rect x="72" y="1256" width="120" height="26" rx="13" fill="#2D6BE4"/>
<text x="132" y="1274" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">体力值上限</text>
<text x="204" y="1274" fill="#4A4B65" font-size="13">该职业体力值所能达到的最大值</text>

<text x="72" y="1306" fill="#1A1B2E" font-size="14" font-weight="500">属性成长（三种类型）：</text>

<rect x="72" y="1320" width="100" height="24" rx="12" fill="#E5F2E9"/>
<text x="122" y="1337" fill="#2E7D32" font-size="11" text-anchor="middle" font-weight="500">无成长</text>
<text x="184" y="1337" fill="#4A4B65" font-size="12">无论等级多少，属性都为基础属性</text>

<rect x="72" y="1350" width="120" height="24" rx="12" fill="#E5F2E9"/>
<text x="132" y="1367" fill="#2E7D32" font-size="11" text-anchor="middle" font-weight="500">默认成长曲线</text>
<text x="204" y="1367" fill="#4A4B65" font-size="12">最终属性 = 基础属性 * 等级倍率（可查看但不可修改）</text>

<rect x="72" y="1380" width="140" height="24" rx="12" fill="#E5F2E9"/>
<text x="142" y="1397" fill="#2E7D32" font-size="11" text-anchor="middle" font-weight="500">自定义成长曲线</text>
<text x="224" y="1397" fill="#4A4B65" font-size="12">计算规则同默认曲线，但支持自由配置</text>

<!-- ========== Section 五: 仇恨配置 ========== -->
<text x="48" y="1450" fill="#2D6BE4" font-size="18" font-weight="700">五、仇恨配置与单位状态</text>

<rect x="48" y="1468" width="540" height="160" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="1468" width="4" height="160" rx="2" fill="#2D6BE4"/>
<text x="72" y="1498" fill="#1A1B2E" font-size="16" font-weight="500">仇恨配置</text>

<text x="72" y="1526" fill="#4A4B65" font-size="14">关卡设置中仇恨类型选择为"自定义"时可配置。</text>

<text x="72" y="1556" fill="#4A4B65" font-size="14">产生仇恨的倍率：拥有该职业的角色通过攻击</text>
<text x="72" y="1578" fill="#4A4B65" font-size="14">和生命恢复行为产生仇恨的倍率。</text>

<rect x="72" y="1598" width="492" height="24" rx="8" fill="#E8EEFB"/>
<text x="84" y="1615" fill="#2D6BE4" font-size="12" font-weight="500">仇恨值 = 实际伤害 * 仇恨倍率 * 职业仇恨倍率 + 仇恨增量</text>

<!-- Card: 单位状态 -->
<rect x="612" y="1468" width="540" height="160" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="1468" width="4" height="160" rx="2" fill="#2D6BE4"/>
<text x="636" y="1498" fill="#1A1B2E" font-size="16" font-weight="500">单位状态</text>

<text x="636" y="1526" fill="#4A4B65" font-size="14">职业附加的单位状态。</text>

<text x="636" y="1556" fill="#4A4B65" font-size="14">当玩家切换到该职业时，自动帮对应角色</text>
<text x="636" y="1578" fill="#4A4B65" font-size="14">配置好单位状态。</text>

<rect x="636" y="1598" width="492" height="24" rx="8" fill="#E5F2E9"/>
<text x="648" y="1615" fill="#2E7D32" font-size="12" font-weight="500">职业切换时自动施加单位状态到角色上</text>

<!-- ========== Section 六: 抗打断配置 ========== -->
<text x="48" y="1670" fill="#2D6BE4" font-size="18" font-weight="700">六、抗打断相关配置</text>

<rect x="48" y="1688" width="1104" height="380" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="1688" width="4" height="380" rx="2" fill="#2D6BE4"/>
<text x="72" y="1718" fill="#1A1B2E" font-size="16" font-weight="500">三种抗打断状态循环</text>

<!-- 抗打断状态 -->
<rect x="72" y="1734" width="120" height="26" rx="13" fill="#E5F2E9"/>
<text x="132" y="1752" fill="#2E7D32" font-size="12" text-anchor="middle" font-weight="500">抗打断状态</text>
<text x="204" y="1752" fill="#4A4B65" font-size="13">未受击时初始值0，受打断值不超过上限时仅有受击表现不被击退/击飞</text>
<text x="204" y="1772" fill="#4A4B65" font-size="12">受打断值每秒按衰减速度衰减至0</text>

<!-- 易受打断状态 -->
<rect x="72" y="1790" width="120" height="26" rx="13" fill="#FDE8E6"/>
<text x="132" y="1808" fill="#C62828" font-size="12" text-anchor="middle" font-weight="500">易受打断状态</text>
<text x="204" y="1808" fill="#4A4B65" font-size="13">受打断值到达上限时进入，受打断值恒为上限</text>
<text x="204" y="1828" fill="#4A4B65" font-size="12">受打断攻击可能被击退/击飞，持续易受打断恢复时间</text>

<!-- 受保护状态 -->
<rect x="72" y="1846" width="120" height="26" rx="13" fill="#E8EEFB"/>
<text x="132" y="1864" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">受保护状态</text>
<text x="204" y="1864" fill="#4A4B65" font-size="13">易受打断结束后进入，受打断值恒为0，不会被击退/击飞</text>
<text x="204" y="1884" fill="#4A4B65" font-size="12">持续受保护时间后回到抗打断状态，开始新一轮循环</text>

<text x="72" y="1918" fill="#1A1B2E" font-size="13" font-weight="500">配置参数：</text>

<rect x="72" y="1934" width="160" height="24" rx="12" fill="#FFF3E0"/>
<text x="152" y="1951" fill="#E65100" font-size="11" text-anchor="middle" font-weight="500">受打断值上限</text>
<text x="244" y="1951" fill="#4A4B65" font-size="12">多少打断值后进入易受打断状态</text>

<rect x="72" y="1964" width="160" height="24" rx="12" fill="#FFF3E0"/>
<text x="152" y="1981" fill="#E65100" font-size="11" text-anchor="middle" font-weight="500">受打断值衰减速度</text>
<text x="244" y="1981" fill="#4A4B65" font-size="12">抗打断状态下每秒衰减值</text>

<rect x="72" y="1994" width="200" height="24" rx="12" fill="#FFF3E0"/>
<text x="172" y="2011" fill="#E65100" font-size="11" text-anchor="middle" font-weight="500">易受打断状态恢复时间</text>
<text x="284" y="2011" fill="#4A4B65" font-size="12">易受打断持续时间，可为0</text>

<rect x="72" y="2024" width="160" height="24" rx="12" fill="#FFF3E0"/>
<text x="152" y="2041" fill="#E65100" font-size="11" text-anchor="middle" font-weight="500">受保护时间</text>
<text x="244" y="2041" fill="#4A4B65" font-size="12">受保护持续时间，可为0</text>

<!-- ========== Section 七: 职业技能与节点图 ========== -->
<text x="48" y="2110" fill="#2D6BE4" font-size="18" font-weight="700">七、职业技能与节点图</text>

<rect x="48" y="2128" width="540" height="220" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="2128" width="4" height="220" rx="2" fill="#2D6BE4"/>
<text x="72" y="2158" fill="#1A1B2E" font-size="16" font-weight="500">职业技能</text>

<text x="72" y="2186" fill="#4A4B65" font-size="14">切换为该职业时，角色技能自动切换为该职业配置的技能。</text>

<rect x="72" y="2206" width="492" height="56" rx="8" fill="#FFF3E0"/>
<text x="84" y="2226" fill="#E65100" font-size="12" font-weight="500">职业模板配置的技能视为默认技能</text>
<text x="84" y="2244" fill="#4A4B65" font-size="12">使用"初始化角色技能"节点时，技能会被还原成职业模板配置的技能</text>

<text x="72" y="2278" fill="#4A4B65" font-size="14">后续仍可通过节点图节点替换别的技能。</text>

<rect x="72" y="2300" width="492" height="36" rx="8" fill="#E8EEFB"/>
<text x="84" y="2323" fill="#2D6BE4" font-size="12" font-weight="500">职业切换 -> 技能自动替换 -> 后续可用节点图修改</text>

<!-- Card: 职业节点图 -->
<rect x="612" y="2128" width="540" height="220" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="2128" width="4" height="220" rx="2" fill="#2D6BE4"/>
<text x="636" y="2158" fill="#1A1B2E" font-size="16" font-weight="500">职业节点图</text>

<text x="636" y="2186" fill="#4A4B65" font-size="14">切换为该职业时，根据模板配置自动帮玩家和角色添加节点图。</text>

<text x="636" y="2216" fill="#1A1B2E" font-size="13" font-weight="500">编辑入口：</text>
<text x="636" y="2236" fill="#4A4B65" font-size="13">自定义职业详情编辑页 > 节点图页签</text>

<text x="636" y="2266" fill="#1A1B2E" font-size="13" font-weight="500">施加单位：</text>
<text x="636" y="2286" fill="#4A4B65" font-size="13">支持玩家和角色两种单位</text>

<rect x="636" y="2300" width="492" height="36" rx="8" fill="#E5F2E9"/>
<text x="648" y="2323" fill="#2E7D32" font-size="12" font-weight="500">职业切换时，切换前的节点图失效，切换后的生效</text>

<!-- ========== Section 八: 节点图操作 ========== -->
<text x="48" y="2390" fill="#2D6BE4" font-size="18" font-weight="700">八、使用节点图修改职业</text>

<rect x="48" y="2408" width="1104" height="220" rx="14" fill="#fff" filter="url(#card)"/>
