<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1610">
<defs>
  <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#2D6BE4"/>
    <stop offset="100%" stop-color="#4A3F6B"/>
  </linearGradient>
  <filter id="card">
    <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/>
  </filter>
  <filter id="elevated">
    <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/>
  </filter>
</defs>
<style>
  text { font-family: 'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif; }
</style>

<rect width="1200" height="1610" fill="#F9F7F2"/>
<rect width="1200" height="6" fill="url(#topGrad)"/>

<!-- Title Card -->
<rect x="48" y="32" width="1104" height="80" rx="14" fill="#fff" filter="url(#elevated)"/>
<rect x="48" y="32" width="4" height="80" rx="2" fill="#2D6BE4"/>
<text x="72" y="72" fill="#1A1B2E" font-size="34" font-weight="bold">单位标签</text>
<text x="240" y="70" fill="#4A4B65" font-size="16">实体的自定义标记系统 -- 全局定义、配置与节点图操作</text>

<!-- ========== Section 一: 功能 ========== -->
<text x="48" y="150" fill="#2D6BE4" font-size="18" font-weight="700">一、单位标签的功能</text>

<rect x="48" y="168" width="1104" height="200" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="168" width="4" height="200" rx="2" fill="#2D6BE4"/>
<text x="72" y="198" fill="#1A1B2E" font-size="16" font-weight="500">核心功能</text>

<text x="72" y="226" fill="#4A4B65" font-size="14">单位标签可以为单位提供特殊标记，在编写关卡运行逻辑时，可使用单位标签快速定位到所有带有该标签的单位。</text>

<text x="72" y="256" fill="#4A4B65" font-size="14">所有在场景内拥有物理实体的单位类型都可以配置单位标签。</text>

<text x="72" y="286" fill="#1A1B2E" font-size="13" font-weight="500">支持配置单位标签的实体类型：</text>

<rect x="72" y="300" width="80" height="26" rx="13" fill="#E8EEFB"/>
<text x="112" y="318" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">造物</text>

<rect x="164" y="300" width="80" height="26" rx="13" fill="#E8EEFB"/>
<text x="204" y="318" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">角色</text>

<rect x="256" y="300" width="80" height="26" rx="13" fill="#E8EEFB"/>
<text x="296" y="318" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500">物件</text>

<rect x="72" y="336" width="1056" height="24" rx="8" fill="#FFF3E0"/>
<text x="84" y="353" fill="#E65100" font-size="12" font-weight="500">同一实体可以添加多个单位标签</text>

<!-- ========== Section 二: 全局定义 ========== -->
<text x="48" y="410" fill="#2D6BE4" font-size="18" font-weight="700">二、单位标签的全局定义</text>

<rect x="48" y="428" width="540" height="260" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="428" width="4" height="260" rx="2" fill="#2D6BE4"/>
<text x="72" y="458" fill="#1A1B2E" font-size="16" font-weight="500">管理工具入口</text>

<text x="72" y="486" fill="#4A4B65" font-size="14">使用单位标签之前，需要预先在单位标签管理工具内进行全局定义。</text>

<text x="72" y="516" fill="#1A1B2E" font-size="13" font-weight="500">入口一：左侧系统菜单</text>
<text x="72" y="536" fill="#4A4B65" font-size="13">在系统菜单中点击【单位标签管理】</text>

<text x="72" y="566" fill="#1A1B2E" font-size="13" font-weight="500">入口二：基础信息面板</text>
<text x="72" y="586" fill="#4A4B65" font-size="13">通过基础信息面板中单位标签管理的</text>
<text x="72" y="606" fill="#4A4B65" font-size="13">"打开单位标签管理工具"按钮快速打开</text>

<rect x="72" y="628" width="492" height="44" rx="8" fill="#E8EEFB"/>
<text x="84" y="648" fill="#2D6BE4" font-size="12" font-weight="500">必须先全局定义，才能在实体上配置</text>
<text x="84" y="666" fill="#4A4B65" font-size="12">在管理工具界面内点击"新建单位标签"即可新增</text>

<!-- Card: 标签属性 -->
<rect x="612" y="428" width="540" height="260" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="428" width="4" height="260" rx="2" fill="#2D6BE4"/>
<text x="636" y="458" fill="#1A1B2E" font-size="16" font-weight="500">标签属性</text>

<rect x="636" y="478" width="140" height="26" rx="13" fill="#2D6BE4"/>
<text x="706" y="496" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">单位标签名称</text>
<text x="788" y="496" fill="#4A4B65" font-size="13">命名，起提示作用</text>
<text x="788" y="514" fill="#8B8DA0" font-size="12">不作为逻辑索引的方式</text>

<rect x="636" y="528" width="140" height="26" rx="13" fill="#2D6BE4"/>
<text x="706" y="546" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">索引</text>
<text x="788" y="546" fill="#4A4B65" font-size="13">该单位标签的唯一标识</text>
<text x="788" y="564" fill="#8B8DA0" font-size="12">用于节点图内修改单位标签数据时进行标识</text>

<rect x="636" y="580" width="140" height="26" rx="13" fill="#2D6BE4"/>
<text x="706" y="598" fill="#fff" font-size="12" text-anchor="middle" font-weight="500">查找引用</text>
<text x="788" y="598" fill="#4A4B65" font-size="13">点击即可展示所有引用了该标签的实体</text>

<rect x="636" y="628" width="492" height="44" rx="8" fill="#FFF3E0"/>
<text x="648" y="648" fill="#E65100" font-size="12" font-weight="500">名称仅提示，索引才是逻辑标识</text>
<text x="648" y="666" fill="#4A4B65" font-size="12">节点图中通过索引引用单位标签</text>

<!-- ========== Section 三: 配置单位标签 ========== -->
<text x="48" y="730" fill="#2D6BE4" font-size="18" font-weight="700">三、配置单位标签</text>

<rect x="48" y="748" width="1104" height="140" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="748" width="4" height="140" rx="2" fill="#2D6BE4"/>
<text x="72" y="778" fill="#1A1B2E" font-size="16" font-weight="500">在元件或实体上配置</text>

<text x="72" y="806" fill="#4A4B65" font-size="14">在元件或实体的基础信息页，可以找到单位标签。</text>

<text x="72" y="836" fill="#4A4B65" font-size="14">点击"添加单位标签"可选择多个全局定义好的单位标签作为初始生效数据。</text>

<text x="72" y="866" fill="#4A4B65" font-size="14">一个元件或实体可以同时具备多个标签。</text>

<!-- ========== Section 四: 节点图操作 ========== -->
<text x="48" y="930" fill="#2D6BE4" font-size="18" font-weight="700">四、通过节点图修改单位标签</text>

<rect x="48" y="948" width="540" height="300" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="948" width="4" height="300" rx="2" fill="#2D6BE4"/>
<text x="72" y="978" fill="#1A1B2E" font-size="16" font-weight="500">服务器节点</text>

<rect x="72" y="994" width="492" height="28" rx="8" fill="#FFF3E0"/>
<text x="84" y="1013" fill="#E65100" font-size="13">实体清空单位标签</text>

<rect x="72" y="1028" width="492" height="28" rx="8" fill="#FFF3E0"/>
<text x="84" y="1047" fill="#E65100" font-size="13">实体添加单位标签</text>

<rect x="72" y="1062" width="492" height="28" rx="8" fill="#FFF3E0"/>
<text x="84" y="1081" fill="#E65100" font-size="13">实体移除单位标签</text>

<rect x="72" y="1096" width="492" height="28" rx="8" fill="#E5F2E9"/>
<text x="84" y="1115" fill="#2E7D32" font-size="13">获取单位标签的实体列表（查询带某标签的所有实体）</text>

<rect x="72" y="1130" width="492" height="28" rx="8" fill="#E5F2E9"/>
<text x="84" y="1149" fill="#2E7D32" font-size="13">获取实体单位标签列表（查询实体拥有的所有标签）</text>

<rect x="72" y="1170" width="492" height="64" rx="8" fill="#E8EEFB"/>
<text x="84" y="1190" fill="#2D6BE4" font-size="12" font-weight="500">服务器节点可执行增/删/清空操作</text>
<text x="84" y="1210" fill="#4A4B65" font-size="12">也可查询：按标签获取实体列表 / 按实体获取标签列表</text>
<text x="84" y="1228" fill="#4A4B65" font-size="12">运行时可动态修改实体的单位标签</text>

<!-- Card: 客户端节点 -->
<rect x="612" y="948" width="540" height="300" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="948" width="4" height="300" rx="2" fill="#2D6BE4"/>
<text x="636" y="978" fill="#1A1B2E" font-size="16" font-weight="500">客户端节点</text>

<rect x="636" y="994" width="492" height="28" rx="8" fill="#E5F2E9"/>
<text x="648" y="1013" fill="#2E7D32" font-size="13">获取单位标签的实体列表</text>

<rect x="636" y="1028" width="492" height="28" rx="8" fill="#E5F2E9"/>
<text x="648" y="1047" fill="#2E7D32" font-size="13">获取实体的单位标签列表</text>

<rect x="636" y="1080" width="492" height="80" rx="8" fill="#E8EEFB"/>
<text x="648" y="1100" fill="#2D6BE4" font-size="12" font-weight="500">客户端节点仅支持查询操作</text>
<text x="648" y="1120" fill="#4A4B65" font-size="12">按标签获取实体列表：查询场景内所有带指定标签的实体</text>
<text x="648" y="1140" fill="#4A4B65" font-size="12">按实体获取标签列表：查询指定实体上拥有的所有标签</text>
<text x="648" y="1156" fill="#4A4B65" font-size="12">不可在客户端节点中修改单位标签</text>

<!-- ========== Section 五: 使用流程 ========== -->
<text x="48" y="1290" fill="#2D6BE4" font-size="18" font-weight="700">五、单位标签使用流程总结</text>

<rect x="48" y="1308" width="1104" height="200" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="1308" width="4" height="200" rx="2" fill="#2D6BE4"/>
<text x="72" y="1338" fill="#1A1B2E" font-size="16" font-weight="500">典型工作流</text>

<circle cx="84" cy="1366" r="14" fill="#2D6BE4"/>
<text x="84" y="1371" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">1</text>
<text x="108" y="1371" fill="#1A1B2E" font-size="14" font-weight="500">全局定义</text>
<text x="220" y="1371" fill="#4A4B65" font-size="13">在单位标签管理工具中新建标签，定义名称和索引</text>

<circle cx="84" cy="1400" r="14" fill="#2D6BE4"/>
<text x="84" y="1405" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">2</text>
<text x="108" y="1405" fill="#1A1B2E" font-size="14" font-weight="500">配置标签</text>
<text x="220" y="1405" fill="#4A4B65" font-size="13">在元件或实体的基础信息页添加标签（可多选）</text>

<circle cx="84" cy="1434" r="14" fill="#2D6BE4"/>
<text x="84" y="1439" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">3</text>
<text x="108" y="1439" fill="#1A1B2E" font-size="14" font-weight="500">节点图查询</text>
<text x="240" y="1439" fill="#4A4B65" font-size="13">使用"获取单位标签的实体列表"快速定位带标签的实体</text>

<circle cx="84" cy="1468" r="14" fill="#2D6BE4"/>
<text x="84" y="1473" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">4</text>
<text x="108" y="1473" fill="#1A1B2E" font-size="14" font-weight="500">运行时修改</text>
<text x="240" y="1473" fill="#4A4B65" font-size="13">通过服务器节点动态添加/移除/清空实体的单位标签</text>

<rect x="72" y="1494" width="1056" height="8" rx="4" fill="transparent"/>

