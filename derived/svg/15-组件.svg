<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 820">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
    <filter id="elevated"><feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/></filter>
  </defs>
  <rect width="1200" height="820" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  
  <!-- Title Card -->
  <rect x="40" y="30" width="1120" height="90" rx="14" fill="#FFFFFF" filter="url(#elevated)"/>
  <rect x="40" y="30" width="4" height="90" rx="2" fill="#2D6BE4"/>
  <text x="70" y="72" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">功能与通用组件</text>
  <text x="70" y="100" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">实体属性、组件机制与生命周期总览</text>
  <!-- Section 1: 功能 -->
  <text x="60" y="155" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">一、功能是什么</text>
  <rect x="60" y="170" width="520" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="198" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">功能是对物件和造物所具有的属性及满足特定需求能力的描述。</text>
  <text x="80" y="222" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">功能包含四个部分：</text>
  <rect x="80" y="236" width="80" height="24" rx="12" fill="#E8EEFB"/><text x="95" y="253" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">基础信息</text>
  <rect x="170" y="236" width="80" height="24" rx="12" fill="#E8EEFB"/><text x="185" y="253" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">特化配置</text>
  <rect x="260" y="236" width="80" height="24" rx="12" fill="#E8EEFB"/><text x="275" y="253" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">通用组件</text>
  <rect x="350" y="236" width="68" height="24" rx="12" fill="#E8EEFB"/><text x="365" y="253" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">节点图</text>
  <text x="80" y="284" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#8B8DA0">玩家和角色也拥有其中的部分功能。</text>
  <!-- Section 2: 功能编辑 -->
  <rect x="620" y="170" width="520" height="140" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="198" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">功能的编辑入口</text>
  <text x="640" y="224" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">选中元件或实体后，即可在右侧的详情面板</text>
  <text x="640" y="246" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">查看及编辑对应的功能。</text>
  <rect x="640" y="262" width="160" height="28" rx="14" fill="#FFF3E0"/><text x="658" y="281" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#1A1B2E">操作流程：选中 > 详情面板</text>
  <!-- Section 3: 通用组件 -->
  <text x="60" y="345" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">二、通用组件</text>
  <rect x="60" y="360" width="1080" height="120" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="388" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">组件定义</text>
  <text x="80" y="412" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">组件是可以添加给实体的一项功能。添加组件后，实体可使用对应功能，也可通过节点图修改组件的数据和逻辑。</text>
  <text x="80" y="436" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">通用组件可自由在元件或实体上添加和删除。部分单位会默认携带一些自身常用的组件。</text>
  <rect x="80" y="450" width="120" height="22" rx="11" fill="#E5F2E9"/><text x="94" y="466" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">自由添加/删除</text>
  <rect x="210" y="450" width="120" height="22" rx="11" fill="#E5F2E9"/><text x="224" y="466" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">节点图可操控</text>
  <rect x="340" y="450" width="120" height="22" rx="11" fill="#E5F2E9"/><text x="354" y="466" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">部分默认携带</text>
  <!-- Section 4: 组件编辑 -->
  <text x="60" y="515" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">三、组件的编辑</text>
  <rect x="60" y="530" width="520" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="80" y="558" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">编辑入口</text>
  <text x="80" y="582" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">选中元件或实体 > 右侧通用组件页签</text>
  <text x="80" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">可查看已配置的组件，或对组件进行添加和删除。</text>
  <!-- Section 5: 生命周期 -->
  <rect x="620" y="530" width="520" height="100" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="558" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="16" font-weight="500" fill="#1A1B2E">组件的生命周期</text>
  <text x="640" y="582" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">组件仅可在编辑时添加/删除，运行中无法动态增删。</text>
  <text x="640" y="604" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">部分组件可通过节点图开启或关闭。实体在场时功能持续生效，直到实体销毁。</text>
  <rect x="640" y="614" width="100" height="22" rx="11" fill="#FDE8E6"/><text x="654" y="630" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="11" fill="#1A1B2E">运行时不可增删</text>
  <!-- Key Points -->
  <text x="60" y="665" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#1B4FC0">四、要点总结</text>
  <rect x="60" y="680" width="1080" height="90" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <circle cx="90" cy="705" r="12" fill="#2D6BE4"/><text x="86" y="710" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#FFF" text-anchor="middle">1</text>
  <text x="112" y="710" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">功能是物件/造物属性与能力的总称，包含基础信息、特化配置、通用组件、节点图</text>
  <circle cx="90" cy="735" r="12" fill="#2D6BE4"/><text x="86" y="740" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#FFF" text-anchor="middle">2</text>
  <text x="112" y="740" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">通用组件可自由添加删除，运行时不可增删，但部分可通过节点图开关</text>
  <circle cx="90" cy="755" r="12" fill="#2D6BE4"/><text x="86" y="760" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#FFF" text-anchor="middle">3</text>
  <text x="112" y="760" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">组件所属实体在场时功能持续生效，直到实体销毁或移除</text>
  <!-- Source --><!-- 相关文档 -->
<text x="48" y="792" fill="#8B8DA0" font-size="12" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">相关文档：</text>
