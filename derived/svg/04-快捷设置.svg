<text x="72" y="1066" fill="#1A1B2E" font-size="16" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">环境设置</text>
<text x="72" y="1090" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">设置当前场景内生效的环境内容</text>
<text x="72" y="1108" fill="#8B8DA0" font-size="12" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">包含：背景、灯光、天气</text>

<rect x="612" y="1036" width="540" height="80" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="1036" width="4" height="80" rx="2" fill="#2D6BE4"/>
<text x="636" y="1066" fill="#1A1B2E" font-size="16" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">快捷键总览</text>
