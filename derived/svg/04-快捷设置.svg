<rect x="72" y="774" width="128" height="24" rx="12" fill="#E8EEFB"/>
<text x="136" y="791" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">造物入战范围</text>
<text x="216" y="791" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">控制是否显示造物入战范围可视化标识</text>

<rect x="72" y="814" width="128" height="24" rx="12" fill="#E8EEFB"/>
<text x="136" y="831" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">预设点常驻显示</text>
<text x="216" y="831" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">控制预设点是否在编辑界面中常驻显示</text>

<rect x="72" y="854" width="160" height="24" rx="12" fill="#E8EEFB"/>
<text x="152" y="871" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">空物件提示模型常驻</text>
<text x="248" y="871" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">控制空物件的示意模型是否常驻显示</text>

<rect x="72" y="894" width="112" height="24" rx="12" fill="#E8EEFB"/>
<text x="128" y="911" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">路径常驻显示</text>
<text x="200" y="911" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">控制路径是否在编辑界面中常驻显示</text>

<!-- Section 4: 环境与快捷键 -->
<text x="48" y="1018" fill="#2D6BE4" font-size="18" font-weight="700" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">四、环境设置与快捷键</text>

