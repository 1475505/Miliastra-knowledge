<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1450">
<defs>
  <linearGradient id="topGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#2D6BE4"/>
    <stop offset="100%" stop-color="#4A3F6B"/>
  </linearGradient>
  <filter id="card">
    <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/>
  </filter>
  <filter id="elevated">
    <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#000" flood-opacity="0.07"/>
  </filter>
</defs>

<!-- Page background -->
<rect width="1200" height="1450" fill="#F9F7F2"/>
<!-- Top color band -->
<rect width="1200" height="6" fill="url(#topGrad)"/>

<!-- Title card -->
<rect x="48" y="32" width="1104" height="80" rx="14" fill="#fff" filter="url(#elevated)"/>
<rect x="48" y="32" width="4" height="80" rx="2" fill="#2D6BE4"/>
<text x="72" y="72" fill="#1A1B2E" font-size="34" font-weight="bold" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">快捷设置</text>
<text x="240" y="72" fill="#4A4B65" font-size="16" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">编辑界面右上角齿轮图标呼出的快捷配置菜单</text>

<!-- Section 1: 镜头控制 -->
<text x="48" y="152" fill="#2D6BE4" font-size="18" font-weight="700" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">一、镜头控制</text>

<rect x="48" y="170" width="540" height="80" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="170" width="4" height="80" rx="2" fill="#2D6BE4"/>
<text x="72" y="200" fill="#1A1B2E" font-size="16" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">镜头水平速度</text>
<text x="72" y="224" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">编辑界面中水平方向移动镜头的速度</text>

<rect x="612" y="170" width="540" height="80" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="612" y="170" width="4" height="80" rx="2" fill="#2D6BE4"/>
<text x="636" y="200" fill="#1A1B2E" font-size="16" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">镜头垂直速度</text>
<text x="636" y="224" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">编辑界面中垂直方向移动镜头的速度</text>

<!-- Section 2: 摆放控制 -->
<text x="48" y="292" fill="#2D6BE4" font-size="18" font-weight="700" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">二、摆放控制</text>

<rect x="48" y="310" width="1104" height="380" rx="14" fill="#fff" filter="url(#card)"/>
<rect x="48" y="310" width="4" height="380" rx="2" fill="#2D6BE4"/>

<rect x="72" y="334" width="80" height="24" rx="12" fill="#E8EEFB"/>
<text x="112" y="351" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">贴地摆放</text>
<text x="168" y="351" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">开启后，布设的单位底部紧贴地形摆放</text>

<rect x="72" y="374" width="80" height="24" rx="12" fill="#E8EEFB"/>
<text x="112" y="391" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">表面吸附</text>
<text x="168" y="391" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">开启后，布设的单位贴近附近的其他单位</text>

<rect x="72" y="414" width="112" height="24" rx="12" fill="#FFF3E0"/>
<text x="128" y="431" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">吸附后转正</text>
<text x="200" y="431" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">仅表面吸附开启后可用，自动旋转贴近的单位</text>
<text x="72" y="456" fill="#8B8DA0" font-size="12" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">如：将物件吸附到墙面时，物件会根据墙面角度自动调整朝向</text>

<rect x="72" y="480" width="80" height="24" rx="12" fill="#E8EEFB"/>
<text x="112" y="497" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">中心对齐</text>
<text x="168" y="497" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">开启后，布设单位的中心点自动与附近单位对齐</text>

<text x="72" y="534" fill="#1A1B2E" font-size="14" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">对齐位置</text>
<text x="184" y="534" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">指定中心对齐时使用的坐标系</text>

<rect x="72" y="554" width="152" height="24" rx="12" fill="#E8EEFB"/>
<text x="148" y="571" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">移动时显示距离</text>
<text x="240" y="571" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">移动单位时在界面底部显示相对位移</text>

<rect x="72" y="594" width="128" height="24" rx="12" fill="#E8EEFB"/>
<text x="136" y="611" fill="#2D6BE4" font-size="12" text-anchor="middle" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">Alt复制数量</text>
<text x="216" y="611" fill="#4A4B65" font-size="14" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">长按 Alt 批量复制时的复制数量</text>

<!-- 摆放 tip -->
<rect x="72" y="640" width="1056" height="36" rx="8" fill="#E8EEFB"/>
<rect x="72" y="640" width="4" height="36" rx="2" fill="#2D6BE4"/>
<text x="92" y="664" fill="#2D6BE4" font-size="13" font-weight="500" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">提示：表面吸附 + 吸附后转正组合使用可快速在斜面/墙面放置物件。</text>

<!-- Section 3: 显示控制 -->
<text x="48" y="732" fill="#2D6BE4" font-size="18" font-weight="700" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif">三、显示控制</text>

<rect x="48" y="750" width="1104" height="226" rx="14" fill="#fff" filter="url(#card)"/>
