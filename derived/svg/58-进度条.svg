<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 850">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2D6BE4"/><stop offset="100%" stop-color="#4A3F6B"/></linearGradient>
    <filter id="card"><feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#2D6BE4" flood-opacity="0.06"/></filter>
  </defs>
  <rect width="1200" height="850" fill="#F9F7F2"/>
  <rect width="1200" height="6" fill="url(#topGrad)"/>
  

  <rect x="40" y="30" width="1120" height="80" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <rect x="40" y="30" width="4" height="80" rx="2" fill="#2D6BE4"/>
  <text x="64" y="62" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="34" font-weight="bold" fill="#1A1B2E">进度条界面控件</text>
  <text x="64" y="90" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#8B8DA0">实时展示变量占比 | 横向/纵向/圆环 | 自定义样式与动态遮罩</text>

  <rect x="40" y="130" width="540" height="130" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">一、进度条的功能</text>
  <text x="60" y="188" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">关卡运行中，实时展示需求变量在默认配置范围中占比的图形界面。</text>
  <rect x="60" y="215" width="100" height="24" rx="12" fill="#E8EEFB"/>
  <text x="75" y="232" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">实时占比展示</text>

  <rect x="620" y="130" width="540" height="130" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="160" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">二、形状类型</text>
  <rect x="640" y="178" width="120" height="36" rx="10" fill="#E8EEFB"/>
  <text x="670" y="201" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#2D6BE4">横向</text>
  <rect x="780" y="178" width="120" height="36" rx="10" fill="#FFF3E0"/>
  <text x="810" y="201" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#E65100">纵向</text>
  <rect x="920" y="178" width="120" height="36" rx="10" fill="#E5F2E9"/>
  <text x="950" y="201" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#2E7D32">圆环</text>
  <text x="640" y="245" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">三种形状适配不同界面场景需求</text>

  <rect x="40" y="280" width="540" height="230" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="60" y="310" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">三、进度样式</text>

  <rect x="60" y="330" width="230" height="40" rx="8" fill="#E8EEFB"/>
  <text x="80" y="355" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#2D6BE4">不显示 - 隐藏进度文本</text>
  <rect x="300" y="330" width="230" height="40" rx="8" fill="#FFF3E0"/>
  <text x="320" y="355" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#E65100">百分比 - 整数精度显示</text>

  <rect x="60" y="380" width="230" height="40" rx="8" fill="#E5F2E9"/>
  <text x="80" y="405" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#2E7D32">真实比例 - 实时显示</text>
  <rect x="300" y="380" width="230" height="40" rx="8" fill="#FDE8E6"/>
  <text x="320" y="405" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#C62828">当前值 - 实时显示数值</text>

  <text x="60" y="448" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">颜色</text>
  <text x="60" y="471" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">进度条内进度图形的底色配置</text>
  <text x="60" y="498" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">当前进度值/最小值/最大值</text>
  <text x="60" y="521" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">均支持配置玩家和关卡的自定义变量</text>

  <rect x="620" y="280" width="540" height="230" rx="14" fill="#FFFFFF" filter="url(#card)"/>
  <text x="640" y="310" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="18" font-weight="700" fill="#2D6BE4">四、自定义样式升级</text>
  <text x="640" y="338" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">新增自定义样式配置：</text>
  <text x="640" y="365" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">底图素材</text>
  <text x="640" y="388" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">奇匠可自定义制作底图素材</text>
  <text x="640" y="415" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">进度图素材</text>
  <text x="640" y="438" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="13" fill="#4A4B65">根据进度值增减进行动态遮罩显示</text>
  <text x="640" y="465" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#1A1B2E">填充方式</text>
  <rect x="640" y="478" width="100" height="24" rx="12" fill="#E8EEFB"/>
  <text x="655" y="495" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2D6BE4">横向填充</text>
  <rect x="750" y="478" width="100" height="24" rx="12" fill="#FFF3E0"/>
  <text x="765" y="495" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#E65100">纵向填充</text>
  <rect x="860" y="478" width="100" height="24" rx="12" fill="#E5F2E9"/>
  <text x="875" y="495" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="12" fill="#2E7D32">圆环填充</text>

  <rect x="40" y="530" width="1120" height="60" rx="14" fill="#FDE8E6"/>
  <text x="60" y="558" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" font-weight="700" fill="#C62828">注意：</text>
  <text x="120" y="558" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">进度图素材中的动效素材无法根据进度进行裁切。</text>
  <text x="120" y="581" font-family="'HYWenHei 85W','Noto Sans SC','PingFang SC','Roboto',sans-serif" font-size="14" fill="#4A4B65">添加方式：在界面控件组编辑窗口，添加界面控件模板 - 进度条。</text>

